      {c:'80100925', t:'True', l:'True Shop'},      {c:'80101706', t:'Hall', l:'DTAC Hall'} ]},
  { k:'FPR', n:'Future Park Rangsit', r:'BMA III', shops:[
      {c:'80101340', t:'True', l:'True Shop'},      {c:'80101341', t:'True', l:'True Shop (H)'},
      {c:'80101707', t:'Hall', l:'DTAC Hall 2F'},   {c:'80101708', t:'Hall', l:'DTAC Hall GF'} ]},
  { k:'MB',  n:'Mega Bangna',         r:'BMA IV',  shops:[
      {c:'80101070', t:'True', l:'True Shop'},      {c:'80101709', t:'Hall', l:'DTAC Hall'} ]}
];
var HALL_CODES = [];
HALL_MALLS.forEach(function(m){ m.shops.forEach(function(s){ s.m = m; HALL_CODES.push(s.c); }); });
/* กลุ่มเทียบ: DTAC Hall 4 สาขา vs True Shop 7 สาขา (แก้รายชื่อที่ HALL_G7 ที่เดียว) */
var HALL_G7 = [ {c:'80100925', l:'Fashion Island'}, {c:'80101340', l:'Future Park Rangsit'}, {c:'80101341', l:'Future Park Rangsit (H)'},
                {c:'80100481', l:'The Mall Bangkapi'}, {c:'80101066', l:'Central Bangna'}, {c:'80101070', l:'Mega Bangna'},
                {c:'80101071', l:'Seacon Square 2'} ];
var HALL_G7M = { k:'G7', n:'Hall vs True 7 สาขา', r:'BMA III–IV' };
var HALL_FETCH = HALL_CODES.slice();
HALL_G7.forEach(function(s){ if (HALL_FETCH.indexOf(s.c)<0) HALL_FETCH.push(s.c); });
var HS = { mall:'all', view:'all', cat:'all', brand:'all', q:'', layout:'mall', data:null };
var HALL_CAT = { 'APPLE IPHONE':0, 'INTER BRAND':1, 'APPLE IPAD':2 };
var HALL_CAT_LBL = { 'APPLE IPHONE':'iPhone', 'INTER BRAND':'Inter Brand', 'APPLE IPAD':'iPad' };

function hallMode(on){ document.body.classList.toggle('mode-hall', !!on);
  if (on) $('resHead').textContent = 'DTAC Hall เทียบ True Shop ห้างเดียวกัน'; }
function loadHall(){
  $('moreWrap').classList.add('hide');
  if (HS.data) return renderHall();
  showSkeleton(4);
  call('apiHall', {shops:HALL_FETCH}).then(function(r){
    if (!r.ok) return fail(r.error);
    HS.data = r; renderHall();
  }).catch(function(e){ fail(e && e.message || e); });
}
/** หมวด/แบรนด์ที่เลือก — ใช้กรองทั้งการ์ด แถบสรุป และตาราง */
function hallRowOk(r){
  if (HS.cat!=='all' && r.cat!==HS.cat) return false;
  if (HS.brand!=='all' && r.br!==HS.brand) return false;
  return true;
}
function hallScope(){ return HS.brand!=='all' ? HS.brand : (HS.cat!=='all' ? (HALL_CAT_LBL[HS.cat]||HS.cat) : 'มือถือ'); }
function hallMalls(){ return HS.mall==='all' ? HALL_MALLS : HALL_MALLS.filter(function(m){ return m.k===HS.mall; }); }
/** ช่องสต็อก 1 สาขา × 1 รุ่น */
function hallCell(st, sold, wkn){
  var aws = sold ? sold/wkn : 0, o = {st:st, aws:aws, cw:null, cls:'hc-nil', lb:''};
  if (aws > 0){
    o.cw = Math.round(st/aws*100)/100;
    if (st === 0){ o.cls='hc-oos'; o.lb='ขาด'; }
    else { var i=cwInfo(o.cw); o.cls='hc-'+i.c; o.lb=i.v+' wk'; }
  } else if (st > 0){ o.cls='hc-ns'; o.lb='No Sale'; }
  return o;
}
function hallPrep(){
  if (HS.mall==='G7') return hallPrepG7();
  var D = HS.data, wkn = D.wk, pos = {};
  D.shops.forEach(function(s,i){ pos[s.code]=i; });
  var malls = hallMalls(), cols = [];
  if (HS.layout==='side'){          // ฝั่ง True Shop ทั้งหมด | ฝั่ง DTAC Hall ทั้งหมด
    ['True','Hall'].forEach(function(k){
      malls.forEach(function(m){ m.shops.forEach(function(s){
        if (s.t===k && pos[s.c]!=null) cols.push({s:s, j:pos[s.c]}); }); });
    });
  } else {                          // จับคู่ตามห้าง
    malls.forEach(function(m){ m.shops.forEach(function(s){ if (pos[s.c]!=null) cols.push({s:s, j:pos[s.c]}); }); });
  }
  cols.forEach(function(c,i){       // ตำแหน่งเส้นคั่น: เริ่มฝั่ง Hall / เริ่มห้างใหม่
    var p=cols[i-1];
    c.sideStart = i>0 && c.s.t==='Hall' && (!p || p.s.t!=='Hall' || (HS.layout!=='side' && p.s.m!==c.s.m));
    c.mallStart = i>0 && HS.layout!=='side' && p.s.m!==c.s.m;
  });
  var toks = HS.q ? HS.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
  var out = [];
  D.rows.forEach(function(r){
    if (!hallRowOk(r)) return;
    if (toks.length){ var t=(r.sm+' '+r.md+' '+r.br).toLowerCase();
      for (var x=0;x<toks.length;x++) if (t.indexOf(toks[x])<0) return; }
    var any=false, sold=0, cells=cols.map(function(c){
      var st=r.st[c.j], sd=r.sold[c.j]; if (st>0||sd>0) any=true; sold+=sd;
      return hallCell(st, sd, wkn);
    });
    if (!any) return;
    var sig=[];
    malls.forEach(function(m){
      var tst=0, taws=0; cols.forEach(function(c,i){ if (c.s.m===m && c.s.t==='True'){ tst+=cells[i].st; taws+=cells[i].aws; } });
      cols.forEach(function(c,i){
        if (c.s.m!==m || c.s.t!=='Hall') return;
        var e=cells[i], tag=m.k+(m.shops.filter(function(z){return z.t==='Hall';}).length>1 ? ' '+c.s.l.replace('DTAC Hall ','') : '');
        if (e.cls==='hc-oos') sig.push({k:'oos', t:'Hall '+tag+' ขาด'+(tst?' · True มี '+tst:'')});
        else if (e.cls==='hc-cw-crit') sig.push({k:'low', t:'Hall '+tag+' ใกล้หมด'+(tst?' · True มี '+tst:'')});
        else if (e.cls==='hc-cw-over') sig.push({k:'over', t:'Hall '+tag+' สต็อกเกิน'});
        else if (e.cls==='hc-ns') sig.push({k:'ns', t:'Hall '+tag+' ไม่มียอดขาย '+e.st+' ชิ้น'+(taws>0?' · True ขาย '+taws.toFixed(1)+'/wk':'')});
      });
    });
    if (HS.view==='act' && !sig.some(function(g){ return g.k==='oos'||g.k==='low'; })) return;
    if (HS.view==='over' && !sig.some(function(g){ return g.k==='over'; })) return;
    if (HS.view==='ns' && !sig.some(function(g){ return g.k==='ns'; })) return;
    out.push({r:r, cells:cells, sold:sold, sig:sig, acts:hallActs(cols, cells)});
  });
  out.sort(function(a,b){
    var ca=HALL_CAT[a.r.cat], cb=HALL_CAT[b.r.cat];
    if (ca!==cb) return (ca==null?9:ca)-(cb==null?9:cb);
    if (a.r.br!==b.r.br) return a.r.br<b.r.br?-1:1;
    if (b.sold!==a.sold) return b.sold-a.sold;
    return a.r.sm<b.r.sm?-1:1;
  });
  return {cols:cols, rows:out, malls:malls, pos:pos, wkn:wkn};
}
/** ตำแหน่งสาขาในข้อมูล (เฉพาะสาขาที่มีข้อมูลในไฟล์รอบนี้) */
function hallPos(){ var pos={}; HS.data.shops.forEach(function(s,i){ if (s.found!==false) pos[s.code]=i; }); return pos; }
/** กลุ่ม Hall 4 สาขา vs True 7 สาขา: คอลัมน์ = Hall รวม | True 7 รวม | True รายสาขา */
function hallPrepG7(){
  var D=HS.data, wkn=D.wk, pos=hallPos(), halls=[], trues=[];
  HALL_MALLS.forEach(function(m){ m.shops.forEach(function(s){ if (s.t==='Hall' && pos[s.c]!=null) halls.push(pos[s.c]); }); });
  HALL_G7.forEach(function(s){ if (pos[s.c]!=null) trues.push(pos[s.c]); });
  var cols=[{s:{c:halls.length+' สาขา', t:'Hall', l:'DTAC Hall รวม', m:HALL_G7M, agg:true}, js:halls},
            {s:{c:trues.length+' สาขา', t:'True', l:'True 7 รวม', m:HALL_G7M, agg:true}, js:trues, sideStart:true}];
  HALL_G7.forEach(function(g,i){
    cols.push({s:{c:g.c, t:'True', l:g.l, m:HALL_G7M, miss:pos[g.c]==null}, js:pos[g.c]!=null?[pos[g.c]]:[], mallStart:i===0});
  });
  var toks = HS.q ? HS.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
  var out=[];
  D.rows.forEach(function(r){
    if (!hallRowOk(r)) return;
    if (toks.length){ var t=(r.sm+' '+r.md+' '+r.br).toLowerCase();
      for (var x=0;x<toks.length;x++) if (t.indexOf(toks[x])<0) return; }
    var cells=cols.map(function(c){
      var st=0, sd=0; c.js.forEach(function(j){ st+=r.st[j]; sd+=r.sold[j]; });
      return hallCell(st, sd, wkn);
    });
    var e=cells[0], T=cells[1];
    if (!(e.st>0 || e.aws>0 || T.st>0 || T.aws>0)) return;
    var ind=cells.slice(2), bs=null, bsell=null;
    ind.forEach(function(x,i){ if (x.st>0 && (!bs || x.st>bs.x.st)) bs={x:x,l:HALL_G7[i].l};
                               if (x.aws>0 && (!bsell || x.aws>bsell.x.aws)) bsell={x:x,l:HALL_G7[i].l}; });
    var has = T.st ? ' · True 7 มี '+nf(T.st)+(bs?' (มากสุด '+bs.l+' '+nf(bs.x.st)+')':'') : ' · True 7 ก็ไม่มีของ';
    var sig=[];
    if (e.cls==='hc-oos') sig.push({k:'oos', t:'Hall ขาด'+has});
    else if (e.cls==='hc-cw-crit') sig.push({k:'low', t:'Hall ใกล้หมด'+has});
    else if (e.cls==='hc-cw-over') sig.push({k:'over', t:'Hall สต็อกเกิน'+(T.aws>0?' · True 7 Cover '+cwInfo(T.cw).v+' wk':'')});
    else if (e.cls==='hc-ns') sig.push({k:'ns', t:'Hall ไม่มียอดขาย '+e.st+' ชิ้น'+(T.aws>0?' · True 7 ขาย '+T.aws.toFixed(1)+'/wk'+(bsell?' (ดีสุด '+bsell.l+')':''):'')});
    if (HS.view==='act' && !sig.some(function(g){ return g.k==='oos'||g.k==='low'; })) return;
    if (HS.view==='over' && !sig.some(function(g){ return g.k==='over'; })) return;
    if (HS.view==='ns' && !sig.some(function(g){ return g.k==='ns'; })) return;
    out.push({r:r, cells:cells, sold:e.aws+T.aws, sig:sig});
  });
  out.sort(function(a,b){
    var ca=HALL_CAT[a.r.cat], cb=HALL_CAT[b.r.cat];
    if (ca!==cb) return (ca==null?9:ca)-(cb==null?9:cb);
    if (a.r.br!==b.r.br) return a.r.br<b.r.br?-1:1;
    if (b.sold!==a.sold) return b.sold-a.sold;
    return a.r.sm<b.r.sm?-1:1;
  });
  return {cols:cols, rows:out, malls:[HALL_G7M], pos:pos, wkn:wkn, g7:true};
}
/** สรุปรายสาขา (มือถือ) — ใช้ทั้งการ์ดห้างและแถบสรุป ไม่ขึ้นกับตัวกรองรุ่น */
function hallShopSum(){
  var D=HS.data, wkn=D.wk, sum={};
  D.shops.forEach(function(s,j){
    var o={all:D.allQty[j], allV:D.allVal[j], q:0, v:0, aws:0, oos:0, low:0, over:0, ns:0, nsq:0};
    D.rows.forEach(function(r){
      if (!hallRowOk(r)) return;
      var st=r.st[j], sd=r.sold[j]; o.q+=st; o.v+=r.val[j]; o.aws+=sd/wkn;
      if (sd>0){ var cw=st/(sd/wkn);
        if (st===0) o.oos++; else if (cw*7<DOI.crit) o.low++; else if (cw*7>DOI.watch) o.over++; }
      else if (st>0){ o.ns++; o.nsq+=st; }
    });
    sum[s.code]=o;
  });
  return sum;
}
function cwTxt(q, aws){
  if (aws>0){ var i=cwInfo(Math.round(q/aws*100)/100); return '<span class="cw '+i.c+'"><i></i>'+i.v+'</span>'; }
  return q>0 ? '<span class="cw cw-none"><i></i>No Sale</span>' : '–';
}
function hallPickOpts(){
  var sel=$('hallPick'); if (!sel || !HS.data) return;
  var nCat={}, nBr={};
  HS.data.rows.forEach(function(r){
    nCat[r.cat]=(nCat[r.cat]||0)+1;
    if (r.cat==='INTER BRAND') nBr[r.br]=(nBr[r.br]||0)+1;
  });
  var brs=Object.keys(nBr).sort(function(a,b){ return (nBr[b]-nBr[a]) || (a<b?-1:1); });
  function op(v,t){ return '<option value="'+esc(v)+'">'+esc(t)+'</option>'; }
  sel.innerHTML = op('all','ทุกแบรนด์ ('+HS.data.rows.length+')') +
    (nCat['APPLE IPHONE'] ? op('c|APPLE IPHONE','iPhone ('+nCat['APPLE IPHONE']+')') : '') +
    (nCat['APPLE IPAD']   ? op('c|APPLE IPAD','iPad ('+nCat['APPLE IPAD']+')') : '') +
    (nCat['INTER BRAND']  ? '<optgroup label="Inter Brand">' + op('c|INTER BRAND','Inter Brand ทั้งหมด ('+nCat['INTER BRAND']+')') +
        brs.map(function(b){ return op('b|'+b, b+' ('+nBr[b]+')'); }).join('') + '</optgroup>' : '');
  sel.value = HS.brand!=='all' ? 'b|'+HS.brand : (HS.cat!=='all' ? 'c|'+HS.cat : 'all');
  if (sel.selectedIndex<0){ HS.cat='all'; HS.brand='all'; sel.value='all'; }
}
function hallAgg(codes, sum){
  var T={all:0,q:0,aws:0,oos:0,low:0,over:0,ns:0,nsq:0,n:0};
  codes.forEach(function(c){ var o=sum[c]; if (!o || HS.data.shops.some(function(s){ return s.code===c && s.found===false; })) return;
    T.n++; ['all','q','aws','oos','low','over','ns','nsq'].forEach(function(k){ T[k]+=o[k]; }); });
  return T;
}
function hallHallCodes(){ var a=[]; HALL_MALLS.forEach(function(m){ m.shops.forEach(function(s){ if (s.t==='Hall') a.push(s.c); }); }); return a; }
function cwPlain(q, aws){ return aws>0 ? 'Cover '+cwInfo(Math.round(q/aws*100)/100).v+' wk' : (q>0?'No Sale':'–'); }
function hallCardG7(sum){
  function line(code, label, cls, miss){

    if (miss || !o) return '<tr class="'+cls+'"><td><div class="pn">'+esc(label)+'</div><div class="pm mono">'+code+'</div></td>'+
      '<td colspan="8" class="pm">ไม่มีข้อมูลสต็อกในไฟล์รอบนี้ — ไม่นับรวมในกลุ่ม</td></tr>';
    return '<tr class="'+cls+'"><td><div class="pn">'+esc(label)+'</div><div class="pm mono">'+code+'</div></td>'+

      '<td class="num">'+(Math.round(o.aws*10)/10).toFixed(1)+'</td><td class="num">'+cwTxt(o.q,o.aws)+'</td>'+
      '<td class="num'+(o.oos?' red':'')+'">'+nf(o.oos)+'</td><td class="num'+(o.low?' amber':'')+'">'+nf(o.low)+'</td>'+
      '<td class="num">'+nf(o.over)+'</td><td class="num'+(o.ns?' grey':'')+'">'+nf(o.ns)+'</td></tr>';
  }
  function subt(label, T, cls){
    return '<tr class="g7sub '+cls+'"><td><div class="pn">'+esc(label)+'</div><div class="pm">'+T.n+' สาขา</div></td><td class="num">'+nf(T.all)+'</td><td class="num b">'+nf(T.q)+'</td>'+
      '<td class="num">'+(Math.round(T.aws*10)/10).toFixed(1)+'</td><td class="num">'+cwTxt(T.q,T.aws)+'</td>'+
      '<td class="num">'+nf(T.oos)+'</td><td class="num">'+nf(T.low)+'</td><td class="num">'+nf(T.over)+'</td><td class="num">'+nf(T.ns)+'</td></tr>';
  }
  var hc=hallHallCodes(), tc=HALL_G7.map(function(g){ return g.c; });
  var H=hallAgg(hc,sum), T=hallAgg(tc,sum), pos=hallPos(), tr='';
  HALL_MALLS.forEach(function(m){ m.shops.forEach(function(s){ if (s.t==='Hall') tr+=line(s.c, m.n+' · '+s.l, 'is-hall', pos[s.c]==null); }); });
  tr+=subt('รวม DTAC Hall', H, 'is-hall');
  HALL_G7.forEach(function(g){
    var nm=(HS.data.shops.filter(function(s){ return s.code===g.c; })[0]||{}).name || g.l;
    var nm2=String(nm).replace(/^True Shop\s*/,'');
    tr+=line(g.c, 'True Shop · '+g.l, 'is-true', pos[g.c]==null);
  });
  tr+=subt('รวม True 7 สาขา', T, 'is-true');
  var A={q:H.q+T.q, aws:H.aws+T.aws, all:H.all+T.all, oos:H.oos+T.oos, low:H.low+T.low, over:H.over+T.over, ns:H.ns+T.ns};
  var ss = A.q ? Math.round(H.q/A.q*1000)/10 : 0, sa = A.aws ? Math.round(H.aws/A.aws*1000)/10 : 0;
  var hint = Math.abs(ss-sa)<3 ? 'ใกล้เคียงกัน' : (ss>sa ? 'Hall ถือของมากกว่ากำลังขาย' : 'Hall ได้ของน้อยกว่ากำลังขาย');
  return '<div class="hcard hcard-wide"><div class="hcard-h"><div><b>DTAC Hall 4 สาขา vs True Shop 7 สาขา</b><span class="tag">'+esc(hallScope())+'</span></div>'+
    '<div class="g7share"><div><span>สัดส่วนสต็อกของ Hall <b>'+ss+'%</b></span><div class="bar"><i style="width:'+ss+'%"></i></div></div>'+
    '<div><span>สัดส่วนยอดขายของ Hall <b>'+sa+'%</b></span><div class="bar"><i style="width:'+sa+'%"></i></div></div>'+
    '<div class="g7hint">'+hint+'</div></div></div>'+
    '<div class="tablewrap"><table class="grid mini"><thead><tr><th>สาขา</th><th class="num">ทุกหมวด</th><th class="num">'+esc(hallScope())+'</th>'+
    '<th class="num">ขาย/wk</th><th class="num">Cover</th><th class="num">ขาด</th><th class="num">ใกล้หมด</th><th class="num">เกิน</th><th class="num" title="มีของแต่ไม่มียอดขายใน 4 สัปดาห์">ไม่มีขาย</th></tr></thead>'+
    '<tbody>'+tr+'</tbody><tfoot><tr><th>TOTAL</th><th class="num">'+nf(A.all)+'</th><th class="num">'+nf(A.q)+'</th>'+
    '<th class="num">'+(Math.round(A.aws*10)/10).toFixed(1)+'</th><th class="num">'+cwTxt(A.q,A.aws)+'</th>'+
    '<th class="num">'+nf(A.oos)+'</th><th class="num">'+nf(A.low)+'</th><th class="num">'+nf(A.over)+'</th><th class="num">'+nf(A.ns)+'</th></tr></tfoot></table></div></div>';
}
/* ---------- v2 DTAC Hall: การ์ดสรุป · การ์ดห้าง · ป้ายสิ่งที่ต้องทำ ---------- */
function hallMallName(s){ var hs=s.m.shops.filter(function(z){ return z.t===s.t; });
  return s.m.n+(hs.length>1 ? ' '+s.l.replace(/^DTAC Hall\s*/,'').replace(/^True Shop\s*/,'') : ''); }
/** ป้าย "สิ่งที่ต้องทำ" บรรทัดเดียว — ชื่อเต็มอยู่ใน title (ชี้เมาส์) */
function hallActs(cols, cells){
  var hallN=0, short=[], over=[], ns=[], tr=[];
  cols.forEach(function(c,i){
    if (c.s.t!=='Hall') return; hallN++;
    var e=cells[i], nm=hallMallName(c.s);
    if (e.cls==='hc-oos' || e.cls==='hc-cw-crit'){
      short.push(nm);
      var tq=0; cols.forEach(function(d,j){ if (d.s.t==='True' && d.s.m===c.s.m) tq+=cells[j].st; });
      if (tq>0 && tr.indexOf(c.s.m.n+' มี '+nf(tq)+' ชิ้น')<0) tr.push(c.s.m.n+' มี '+nf(tq)+' ชิ้น');
    } else if (e.cls==='hc-cw-over') over.push(nm);
    else if (e.cls==='hc-ns') ns.push(nm+' '+nf(e.st)+' ชิ้น');
  });
  function where(a){ return hallN<2 ? '' : (a.length===hallN ? ' · ทุกสาขา' : ' · '+a.length+' สาขา'); }
  var o=[];
  if (short.length) o.push({k:'oos', t:'ขาด/ใกล้หมด'+where(short), tip:short.join(', ')});
  if (tr.length)    o.push({k:'tr',  t:'โอนจาก True ได้', tip:'True Shop ห้างเดียวกัน: '+tr.join(', ')});
  if (over.length)  o.push({k:'over',t:'สต็อกเกิน'+where(over), tip:over.join(', ')+' · ระบายออก'});
  if (ns.length)    o.push({k:'ns',  t:'ไม่มียอดขาย'+where(ns), tip:ns.join(', ')});

<script>

    for(var j=0;j<S.length;j++){
      var sh=S[j],n=0;
      if(sAre && !sAre[sh[3]]) n|=F_ARE;
      if(sSty && !sSty[sh[4]||'ไม่ระบุ']) n|=F_STY;
      if(sShp && !sShp[sh[0]]) n|=F_SHP;
      if(skw.length && !all(IDX.stext[j],skw)) n|=F_SHP;
      if(pinS && sh[0]!==pinS) n|=F_SHP;
      sf[j]=n;
    }

    var fT={},fA={},fC={},fB={},fM={},fS={},aggP={},aggS={},aggU={},aggPair={},hits=[];
    var tq=0,tv=0,nr=0,ss={},sk={};
    for(var k=0;k<ST.length;k+=3){
      var si=ST[k],pi=ST[k+1],bal=ST[k+2];
      var mask=pf[pi]|sf[si]|((bal<minQ||bal>maxQ)?F_QTY:0);
      if(wf){
        var pr2=P[pi],sh2=S[si];
        if((mask&~F_ARE)===0) fA[sh2[3]]=(fA[sh2[3]]||0)+1;
        if((mask&~F_STY)===0){ var ty2=sh2[4]||'ไม่ระบุ'; fT[ty2]=(fT[ty2]||0)+1; }
        if((mask&~F_CAT)===0) fC[pr2[2]]=(fC[pr2[2]]||0)+1;
        if((mask&~F_BRD)===0) fB[pr2[3]]=(fB[pr2[3]]||0)+1;
        if((mask&~F_MDL)===0) fM[pr2[4]]=(fM[pr2[4]]||0)+1;
        if((mask&~F_STS)===0) fS[pr2[7]]=(fS[pr2[7]]||0)+1;
      }
      if(mask!==0) continue;
      var price=P[pi][8]||0;
      nr++; tq+=bal; tv+=bal*price; ss[si]=1; sk[pi]=1;
      if(HAS){
        var ui=P[pi][9], pkey=si+'|'+ui;
        var au=aggU[ui]||(aggU[ui]={q:0,sold:0,shops:0,skus:{}});
        au.q+=bal; au.skus[pi]=1;
        var ap=aggPair[pkey];
        if(!ap){ ap=aggPair[pkey]={q:0,sold:SM[pkey]||0}; au.sold+=ap.sold; au.shops++; }
        ap.q+=bal;
      }
      if(group==='product'){ var a=aggP[pi]||(aggP[pi]={q:0,s:0}); a.q+=bal; a.s++; }
      else if(group==='shop'){ var b=aggS[si]||(aggS[si]={q:0,k:0,v:0}); b.q+=bal; b.k++; b.v+=bal*price; }
      else hits.push(k);
    }

    var sort=req.sort||'qty', items=[], total=0;
    var dir=(req.dir==='asc')?1:-1;
    if(sort==='cwasc'){ sort='cover'; dir=1; }
    if(sort==='cwdesc'){ sort='cover'; dir=-1; }
    var page=Math.max(0,+(req.page||0)), size=Math.max(1,+(req.pageSize||50));
    var from=page*size, to=from+size;
    function sortList(l,nk){
      l.sort(function(a,b){
        var x,y;
        switch(sort){
          case 'name':  x=a[nk];        y=b[nk];        break;
          case 'brand': x=a.br||'';     y=b.br||'';     break;
          case 'shop':  x=a.sn||'';     y=b.sn||'';     break;
          case 'price': x=a.pr||0;      y=b.pr||0;      break;
          case 'value': x=a.val||0;     y=b.val||0;     break;
          case 'aws':   x=a.aws==null?-1:a.aws; y=b.aws==null?-1:b.aws; break;
          case 'cover':
            if(a.cw==null&&b.cw==null) return b.qty-a.qty;
            if(a.cw==null) return 1; if(b.cw==null) return -1;
            x=a.cw; y=b.cw; break;
          default:      x=a.qty||0;     y=b.qty||0;
        }
        if(typeof x==='string') return dir*(x<y?-1:(x>y?1:0));
        return dir*(x-y);
      });
    }
    if(group==='product'){
      var L=[];
      for(var key in aggP){ var pp=P[+key],ag=aggP[key];
        var au2=HAS?aggU[pp[9]]:null;
        L.push({pc:pp[0],pn:pp[1],cat:pp[2],br:pp[3],md:pp[4],sm:pp[5],vr:pp[6],st:pp[7],
                pr:pp[8]||0,qty:ag.q,shops:ag.s,val:(pp[8]||0)*ag.q,
                aws:au2?Math.round(au2.sold/WK*100)/100:null,
                cw:au2?cwCalc(au2.q,au2.sold):null}); }
      sortList(L,'pn'); total=L.length; items=L.slice(from,to);
    } else if(group==='sub'){
      var L3=[], cc={}; (IDX.coverCats||[]).forEach(function(c){cc[c]=1;});
      for(var ku in aggU){
        var uid=+ku, meta=IDX.subMeta[uid]||{}, a3=aggU[ku];
        if(!cc[meta.cat]) continue;
        L3.push({ui:uid,sm:meta.n||'-',md:meta.md||'',br:meta.br||'',cat:meta.cat||'',
                 qty:a3.q,shops:a3.shops,skus:ck(a3.skus),
                 sold:Math.round(a3.sold*100)/100,
                 aws:Math.round(a3.sold/WK*100)/100,
                 cw:cwCalc(a3.q,a3.sold)});
      }
      sortList(L3,'sm'); total=L3.length; items=L3.slice(from,to);
    } else if(group==='shop'){
      var L2=[];
      for(var k2 in aggS){ var sx=S[+k2],a2=aggS[k2];
        L2.push({sc:sx[0],sn:sx[2]||sx[1],th:sx[1],ar:sx[3],qty:a2.q,skus:a2.k,val:a2.v}); }
      sortList(L2,'sn'); total=L2.length; items=L2.slice(from,to);
    } else {
      total=hits.length;
      var keyed=hits.map(function(kk){
        var sp2=S[ST[kk]],pp3=P[ST[kk+1]],bb2=ST[kk+2];
        var ap3=HAS?aggPair[ST[kk]+'|'+pp3[9]]:null, v;
        switch(sort){
          case 'name':  v=pp3[1]; break;
          case 'shop':  v=sp2[2]||sp2[1]; break;
          case 'brand': v=pp3[3]; break;
          case 'price': v=pp3[8]||0; break;
          case 'value': v=(pp3[8]||0)*bb2; break;
          case 'aws':   v=ap3?ap3.sold/WK:-1; break;
          case 'cover': v=ap3?cwCalc(ap3.q,ap3.sold):null; break;
          default:      v=bb2;
        }
        return {k:kk,v:v,b:bb2};
      });
      keyed.sort(function(a,b){
        if(sort==='cover'){
          if(a.v==null&&b.v==null) return b.b-a.b;
          if(a.v==null) return 1; if(b.v==null) return -1;
        }
        if(typeof a.v==='string') return dir*(a.v<b.v?-1:(a.v>b.v?1:0));
        return dir*(a.v-b.v);
      });
      keyed.slice(from,to).map(function(o){return o.k;}).forEach(function(kk){
        var sp=S[ST[kk]],pp=P[ST[kk+1]],bb=ST[kk+2];
        var ap2=HAS?aggPair[ST[kk]+'|'+pp[9]]:null;
        items.push({sc:sp[0],sn:sp[2]||sp[1],th:sp[1],ar:sp[3],pc:pp[0],pn:pp[1],cat:pp[2],
                    br:pp[3],md:pp[4],sm:pp[5],vr:pp[6],st:pp[7],pr:pp[8]||0,b:bb,val:(pp[8]||0)*bb,
                    aws:ap2?Math.round(ap2.sold/WK*100)/100:null,
                    cw:ap2?cwCalc(ap2.q,ap2.sold):null, pq:ap2?ap2.q:null});
      });
    }
    return { items:items, total:total, page:page, hasMore:to<total,
             summary:{rows:nr,qty:tq,value:tv,shops:ck(ss),skus:ck(sk)},
             facets: wf ? {area:fA,stype:fT,cat:fC,brand:fB,model:fM,status:fS} : null };
  }

  var API = {
    apiBootstrap: function(){
      var areas={},stys={},cats={},brands={},models={},sts={},shops=[],tq=0,tv=0;
      IDX.shops.forEach(function(s){ areas[s[3]]=1; stys[s[4]||'ไม่ระบุ']=1; shops.push({c:s[0],n:s[2]||s[1],t:s[1],a:s[3],y:s[4]||'ไม่ระบุ'}); });
      IDX.products.forEach(function(p){ cats[p[2]]=1; brands[p[3]]=1; models[p[4]]=1; sts[p[7]]=1; });
      for(var k=0;k<IDX.stock.length;k+=3){ var b=IDX.stock[k+2];
        tq+=b; tv+=b*(IDX.products[IDX.stock[k+1]][8]||0); }
      shops.sort(function(a,b){ return a.n<b.n?-1:1; });
      return { ok:true, built:IDX.built, dataDate:IDX.dataDate,
        hasSales:HAS, coverDays:IDX.coverDays||28, coverCats:IDX.coverCats, logos:IDX.logos||{},
        summary:{rows:IDX.stock.length/3, shops:IDX.shops.length, skus:IDX.products.length, qty:tq, value:tv},
        areas:ksort(areas), stypes:ksort(stys), shops:shops, cats:ksort(cats), brands:ksort(brands),
        models:ksort(models), statuses:ksort(sts) };
    },
    apiSearch: function(req){
      var t0=performance.now();
      var r=runQuery(req||{});
      r.ok=true; r.took=Math.round(performance.now()-t0); r.built=IDX.built;
      return r;
    },
    apiExport: function(req){
      req=req||{}; req.group='row'; req.page=0; req.pageSize=20000; req.wantFacets=false;
      var r=runQuery(req);
      function q(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
      var out=['SHOP_CODE,SHOP_NAME,AREA,PRODUCT_CODE,PRODUCT_NAME,CATEGORY,BRAND,MODEL,SUBMODEL,VARIANT,STATUS,PRICE,BALANCE,AMOUNT,AWS,COVER_WEEK'];
      r.items.forEach(function(x){
        out.push([x.sc,q(x.sn),q(x.ar),x.pc,q(x.pn),q(x.cat),q(x.br),q(x.md),q(x.sm),q(x.vr),q(x.st),x.pr,x.b,x.pr*x.b,
                  x.aws==null?'':x.aws, x.cw==null?'':x.cw].join(','));
      });
      return { ok:true, csv:out.join('\n'), rows:r.items.length };
    },
    /* DTAC Hall monitor: สต็อก + ยอดขาย 28 วัน รายรุ่นย่อย (เฉพาะหมวดที่มี Cover Week) ของสาขาที่ส่งมา */
    apiHall: function(req){
      var codes=(req&&req.shops)||[], n=codes.length, S=IDX.shops, P=IDX.products, ST=IDX.stock;
      var col={}, info=codes.map(function(c){ return {code:c,found:false}; });
      S.forEach(function(sh,i){ var j=codes.indexOf(sh[0]);
        if(j>=0){ col[i]=j; info[j]={code:sh[0],th:sh[1],name:sh[2]||sh[1],area:sh[3],found:true}; } });
      var cc={}; (IDX.coverCats||[]).forEach(function(c){cc[c]=1;});
      function z(){ var a=[]; for(var i=0;i<n;i++) a.push(0); return a; }
      var rows={}, allQ=z(), allV=z();
      function row(ui){
        var m=IDX.subMeta[ui]; if(!m||!cc[m.cat]) return null;
        return rows[ui]||(rows[ui]={ui:ui,sm:m.n,br:m.br,md:m.md,cat:m.cat,st:z(),sold:z(),val:z()});
      }
      for(var k=0;k<ST.length;k+=3){
        var j=col[ST[k]]; if(j==null) continue;
        var p=P[ST[k+1]], b=ST[k+2], pr=p[8]||0;
        allQ[j]+=b; allV[j]+=b*pr;
        var r=row(p[9]); if(!r) continue;
        r.st[j]+=b; r.val[j]+=b*pr;
      }
      for(var q=0;q<SA.length;q+=3){
        var j2=col[SA[q]]; if(j2==null) continue;
        var r2=row(SA[q+1]); if(!r2) continue;
        r2.sold[j2]+=SA[q+2];
      }
      var list=[]; for(var u in rows) list.push(rows[u]);
      return { ok:true, built:IDX.built, wk:WK, shops:info, rows:list, allQty:allQ, allVal:allV };
    },
    apiRebuild: function(){
      return { ok:false, error:'โหมดพรีวิว: ปุ่มนี้จะทำงานจริงหลังติดตั้งบน Google Apps Script' };
    }
  };

  // แทนที่ตัวเรียก google.script.run ด้วย engine ในเครื่อง
  window.call = function(fn, arg){
    return new Promise(function(res){ setTimeout(function(){ res(API[fn](arg)); }, 8); });
  };
  call = window.call;

  var SITE = !!window.__SITE__;

  if (!SITE) {
    // หน้าพรีวิวในแชท: เบราว์เซอร์บล็อกการดาวน์โหลดไฟล์ — แจ้งผู้ใช้แทน
    window.doExport = function(){
      if (STATE.group==='hall' && typeof exportHall==='function') return exportHall();
      call('apiExport', JSON.parse(JSON.stringify(STATE))).then(function(r){
        toast('พร้อมส่งออก ' + (r.rows||0).toLocaleString('th-TH') + ' แถว — ปุ่มนี้จะดาวน์โหลดไฟล์จริงเมื่อเปิดจากเว็บ');
      });
    };
  }
  // ปุ่มรีเฟรชบนเว็บสแตติกไม่ได้อ่านชีตใหม่ — บอกวันที่ของข้อมูลแทน
  window.doRefresh = function(){
    toast('ข้อมูลชุดนี้ ณ ' + IDX.built + ' · อัปเดตได้โดยรัน build แล้ว push ขึ้นใหม่');
  };

  document.addEventListener('DOMContentLoaded', function(){
    var f = document.querySelector('footer');
    if (f) f.innerHTML = SITE
      ? 'Check Stock Balance Daily · ข้อมูล ณ ' + IDX.built + ' · ค้นหาและคำนวณ Cover Week ในเครื่องผู้ใช้ ไม่มีการส่งข้อมูลออกนอกเบราว์เซอร์'
      : 'โหมดพรีวิว · ข้อมูล ณ ' + IDX.built + ' · ในระบบ Apps Script การค้นหาทั้งหมดประมวลผลบนเซิร์ฟเวอร์ และไม่ส่ง Raw Data ลงเบราว์เซอร์';
  });
  // อย่าเรียก init เองถ้าหน้านี้ล็อกด้วยรหัสผ่าน — lock.js จะเรียกให้หลังปลดล็อก
  // (ถ้าเรียกซ้ำ ปุ่มทุกตัวจะมี listener ซ้อนกันสองชั้น กดแล้วเหมือนไม่ทำงาน)
  if (!window.__LOCKED__ && document.readyState !== 'loading')
    setTimeout(function(){ if (typeof init === 'function') init(); }, 0);
  };
})();
if (window.__DATA__) window.__BOOT_ENGINE__();

</script>
<script>
/* =========================================================================
 * LOCK — ปลดล็อกข้อมูลด้วยรหัสผ่าน
 * ข้อมูลทั้งก้อนถูก gzip แล้วเข้ารหัส AES-256-GCM (คีย์จาก PBKDF2-SHA256
 * 250,000 รอบ) ไม่ใช่แค่หน้ากั้น — ถ้าไม่มีรหัสผ่าน view-source ก็เห็นแต่
 * ข้อความที่อ่านไม่ออก
 * ======================================================================= */
(function () {
  if (!window.__ENC__) return;

  var ITER = 250000, KEY_SS = 'csbd_pw';

  var css = document.createElement('style');
  css.textContent =
  '.lk{position:fixed;inset:0;z-index:999;display:grid;place-items:center;padding:20px;' +
    'background:linear-gradient(125deg,#0A1F3C 0%,#133C74 52%,#1B4FA8 100%)}' +
  '.lk-card{width:100%;max-width:372px;background:#fff;border-radius:20px;padding:26px 24px 22px;' +
    'box-shadow:0 24px 60px rgba(6,18,38,.42);text-align:center}' +
  '.lk-mark{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;display:grid;place-items:center;' +
    'background:linear-gradient(140deg,#1657CE,#2B72F0);color:#fff}' +
  '.lk-mark svg{width:27px;height:27px}' +
  '.lk h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px;color:#0E1726}' +
  '.lk p{margin:5px 0 18px;font-size:12.5px;color:#7A8AA3;line-height:1.55}' +
  '.lk input{width:100%;height:50px;border:1.5px solid #E3E9F2;border-radius:14px;padding:0 14px;' +
    'font-size:16px;text-align:center;letter-spacing:2px;background:#fff;color:#0E1726}' +
  '.lk input:focus{outline:none;border-color:#2B72F0;box-shadow:0 0 0 4px #E4EDFD}' +
  '.lk button{width:100%;height:50px;margin-top:10px;border:0;border-radius:14px;cursor:pointer;' +
    'font-weight:700;font-size:15px;color:#fff;font-family:inherit;' +
    'background:linear-gradient(135deg,#1657CE,#2B72F0);box-shadow:0 6px 16px rgba(22,87,206,.32)}' +
  '.lk button:disabled{opacity:.6;cursor:default}' +
  '.lk-err{margin-top:11px;font-size:12.5px;font-weight:600;color:#D93A3A;min-height:18px}' +
  '.lk-foot{margin-top:16px;font-size:11px;color:#A6B3C6}' +
  'body.lk-on{overflow:hidden}';
  document.head.appendChild(css);

  var box = document.createElement('div');
  box.className = 'lk';
  box.innerHTML =
    '<div class="lk-card">' +
      '<div class="lk-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" ' +
        'stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>' +
        '<path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/><circle cx="12" cy="15.7" r="1.3"/></svg></div>' +
      '<h2>Check Stock Balance Daily</h2>' +
      '<p>ข้อมูลสต็อกถูกเข้ารหัสไว้<br>กรอกรหัสผ่านเพื่อเปิดใช้งาน</p>' +
      '<input id="lkPw" type="password" inputmode="text" autocomplete="current-password" placeholder="รหัสผ่าน">' +
      '<button id="lkGo" type="button">เข้าใช้งาน</button>' +
      '<div class="lk-err" id="lkErr"></div>' +
      '<div class="lk-foot">ข้อมูล ณ ' + (window.__BUILT__ || '') + '</div>' +
    '</div>';

  function show() {
    document.body.classList.add('lk-on');
    document.body.appendChild(box);
    var pw = document.getElementById('lkPw'), go = document.getElementById('lkGo');
    go.addEventListener('click', function () { attempt(pw.value); });
    pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') attempt(pw.value); });
    setTimeout(function () { pw.focus(); }, 60);

    var saved = null;
    try { saved = sessionStorage.getItem(KEY_SS); } catch (e) {}
    if (saved) attempt(saved, true);
  }

  function say(msg) { document.getElementById('lkErr').textContent = msg || ''; }
  function busy(on) {
    var go = document.getElementById('lkGo');
    if (go) { go.disabled = on; go.textContent = on ? 'กำลังเปิดข้อมูล…' : 'เข้าใช้งาน'; }
  }

  function attempt(pw, silent) {
    if (!pw) { say('กรุณากรอกรหัสผ่าน'); return; }
    if (!window.crypto || !crypto.subtle) {
      say('เบราว์เซอร์นี้เปิดข้อมูลที่เข้ารหัสไม่ได้ — กรุณาใช้เบราว์เซอร์รุ่นใหม่');
      return;
    }
    say(''); busy(true);
    decrypt(pw).then(function (json) {
      try { sessionStorage.setItem(KEY_SS, pw); } catch (e) {}
      window.__DATA__ = JSON.parse(json);
      box.remove();
      document.body.classList.remove('lk-on');
      window.__BOOT_ENGINE__();
      init();
    }).catch(function (err) {
      busy(false);
      try { sessionStorage.removeItem(KEY_SS); } catch (e) {}
      say(silent ? '' : (String(err && err.message).indexOf('gzip') >= 0
        ? 'เบราว์เซอร์นี้เก่าเกินไป กรุณาอัปเดตหรือใช้ Chrome/Safari รุ่นใหม่'
        : 'รหัสผ่านไม่ถูกต้อง'));
      var pwEl = document.getElementById('lkPw');
      if (pwEl && !silent) { pwEl.value = ''; pwEl.focus(); }
    });
  }

  function decrypt(pw) {
    var raw = Uint8Array.from(atob(window.__ENC__), function (c) { return c.charCodeAt(0); });
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(function (buf) {
        if (typeof DecompressionStream === 'undefined') throw new Error('no gzip support');
        var st = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(st).text();
      });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();

</script>
