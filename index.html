<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1F3C">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="ค้นหาสต็อกสินค้าคงเหลือรายสาขา">
<title>Check Stock Balance Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================== TOKENS ================================== */
:root{
  --navy-900:#0A1F3C; --navy-800:#0E2C55; --navy-700:#133C74;
  --blue-600:#1657CE; --blue-500:#2B72F0; --blue-100:#E4EDFD; --blue-50:#F2F6FE;
  --ink:#0E1726; --ink-2:#41506A; --ink-3:#7A8AA3;
  --line:#E3E9F2; --line-2:#EFF3F9;
  --bg:#F5F7FB; --card:#FFFFFF;
  --ok:#17875A; --ok-bg:#E2F4EA;
  --warn:#B86E0A; --warn-bg:#FCEFD8;
  --danger:#CC3B33; --danger-bg:#FCE6E3;
  --violet:#5B45C4; --violet-bg:#ECE8FB;
  --hall:#8A6A4E; --hall-bg:#F6F1EA; --hall-line:#D9C7B4;
  --true:#3E5F82; --true-bg:#EAF0F6;
  --r-sm:10px; --r:14px; --r-lg:20px;
  --sh-1:0 1px 2px rgba(14,23,38,.06), 0 1px 3px rgba(14,23,38,.05);
  --sh-2:0 4px 14px rgba(14,23,38,.08);
  --sh-3:0 12px 32px rgba(14,23,38,.14);
  --maxw:1320px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
/* Inter รับหน้าที่อักษรละติน/ตัวเลข · Noto Sans Thai รับช่วงอักษรไทย (Inter ไม่มีกลิฟไทย) */
body{
  font-family:'Inter','Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',
              'Helvetica Neue',Arial,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  -webkit-text-size-adjust:100%;
  font-feature-settings:"cv05" 1, "ss01" 1;   /* Inter: เลข 1 มีฐาน, ตัว l โค้ง อ่านง่ายขึ้น */
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hide{display:none !important}

/* ============================== TOP BAR ================================= */
/* ไม่ตรึงแถบหัวไว้ ไม่งั้นการ์ดค้นหาจะมุดอยู่ข้างใต้แล้วกดปุ่มตัวกรองไม่ได้บนจอเตี้ย */
.topbar{
  position:relative;z-index:60;
  background:linear-gradient(100deg,var(--navy-900) 0%,var(--navy-700) 55%,var(--blue-600) 130%);
  color:#fff;box-shadow:0 2px 10px rgba(10,31,60,.25);
}
.topbar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);
  display:grid;place-items:center;flex:0 0 auto;backdrop-filter:blur(4px)}
.logo svg{width:22px;height:22px}
.brandtxt{min-width:0;flex:1}
.brandtxt h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandtxt p{margin:0;font-size:11.5px;opacity:.72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;
  background:rgba(255,255,255,.13);font-size:12px;font-weight:500;white-space:nowrap}
.pill svg{width:14px;height:14px;opacity:.85}
.icon-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.13);
  display:grid;place-items:center;transition:.15s}
.icon-btn:hover{background:rgba(255,255,255,.25)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================== HERO ==================================== */
.hero{position:relative;overflow:hidden;
  background:linear-gradient(115deg,var(--navy-800) 0%,var(--navy-700) 48%,#1B4FA8 100%);
  color:#fff;padding:22px 0 62px}
.hero-deco{position:absolute;inset:0;opacity:.5;pointer-events:none}
.hero .wrap{position:relative}
.hero-title{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.hero-title h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
.hero-title span{display:block;font-size:12.5px;font-weight:400;opacity:.75;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r);padding:12px 14px;backdrop-filter:blur(6px)}
.kpi .k-top{display:flex;align-items:center;gap:7px;font-size:11.5px;opacity:.8;font-weight:500}
.kpi .k-top svg{width:14px;height:14px}
.kpi .k-val{font-size:22px;font-weight:700;line-height:1.25;margin-top:3px}
.kpi .k-sub{font-size:11px;opacity:.65}

/* ============================== SEARCH CARD ============================= */
.panel{margin-top:-44px;position:relative;z-index:40}
.searchcard{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-3);padding:14px}
.searchrow{display:grid;grid-template-columns:1fr 300px auto;gap:10px}
.field{position:relative;display:flex;align-items:center}
.field>svg.lead{position:absolute;left:13px;width:18px;height:18px;color:var(--ink-3);pointer-events:none}
.field input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:var(--r);
  padding:0 40px 0 42px;background:#fff;transition:.15s;font-size:15px}
.field input::placeholder{color:var(--ink-3)}
.field input[type=search]::-webkit-search-cancel-button,
.field input[type=search]::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.field input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 4px var(--blue-100)}
.field .clear{position:absolute;right:8px;width:28px;height:28px;border-radius:8px;display:none;place-items:center;color:var(--ink-3)}
.field .clear:hover{background:var(--line-2);color:var(--ink)}
.field.has .clear{display:grid}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;
  border-radius:var(--r);font-weight:600;font-size:14.5px;transition:.15s;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,var(--blue-600),var(--blue-500));color:#fff;box-shadow:0 4px 12px rgba(22,87,206,.3)}
.btn-primary:hover{filter:brightness(1.07)}
.btn-ghost{background:var(--blue-50);color:var(--blue-600);border:1.5px solid var(--blue-100)}
.btn-ghost:hover{background:var(--blue-100)}
.btn-ghost.on{background:var(--blue-100);color:var(--navy-700);border-color:var(--blue-500)}
.badge-n{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#fff;color:var(--blue-600);
  font-size:11.5px;font-weight:700;display:grid;place-items:center}
.btn-ghost:not(.on) .badge-n{background:var(--blue-600);color:#fff}

/* filter panel */
.filters{display:none;margin-top:12px;padding-top:14px;border-top:1px solid var(--line-2)}
.filters.open{display:block}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
body.ms-sheet .panel{z-index:80}   /* ให้ bottom sheet อยู่เหนือฉากหลังทึบบนมือถือ */

/* multi-select dropdown */
.ms{position:relative}
.ms-btn{width:100%;height:52px;border:1.5px solid var(--line);border-radius:var(--r-sm);background:#fff;
  display:flex;align-items:center;gap:9px;padding:0 11px;text-align:left;transition:.15s}
.ms-btn:hover{border-color:#C6D4E9}
.ms.open .ms-btn{border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.ms.has .ms-btn{border-color:var(--blue-500);background:var(--blue-50)}
.ms-in{min-width:0;flex:1}
.ms-lbl{display:block;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.3px;line-height:1.35}
.ms-val{display:block;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-val.ph{color:var(--ink-3);font-weight:500}
.ms-cnt{min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--blue-600);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.ms-car{width:16px;height:16px;color:var(--ink-3);transition:.18s;flex:0 0 auto}
.ms.open .ms-car{transform:rotate(180deg)}
.ms-pop{position:absolute;z-index:45;top:calc(100% + 6px);left:0;right:0;min-width:230px;background:#fff;
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-3);display:none;overflow:hidden}
.ms.open .ms-pop{display:block}
.ms-head{display:none;align-items:center;gap:10px;padding:12px 14px 4px}
.ms-head b{flex:1;font-size:15px}
.ms-head button{width:30px;height:30px;border-radius:9px;background:var(--line-2);display:grid;place-items:center;color:var(--ink-2)}
.ms-head button svg{width:13px;height:13px}
.ms-search{padding:8px 8px 6px}
.ms-search input{width:100%;height:38px;border:1.5px solid var(--line);border-radius:9px;padding:0 11px;background:#fff}
.ms-search input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.ms-list{max-height:266px;overflow:auto;padding:2px 6px 6px;overscroll-behavior:contain}
.ms-opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer;font-size:13.5px;user-select:none}
.ms-opt:hover{background:#F4F7FD}
.ms-opt.on{background:var(--blue-50)}
.ms-box{width:18px;height:18px;border-radius:5px;border:1.8px solid #C4D0E2;background:#fff;
  flex:0 0 auto;display:grid;place-items:center;transition:.12s}
.ms-opt.on .ms-box{background:var(--blue-600);border-color:var(--blue-600)}
.ms-box svg{width:11px;height:11px;color:#fff;opacity:0}
.ms-opt.on .ms-box svg{opacity:1}
.ms-tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ms-n{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;flex:0 0 auto}
.ms-opt.on .ms-n{color:var(--blue-600)}
.ms-grp{padding:10px 10px 4px;font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.6px}
.ms-grp:first-child{padding-top:4px}
.ms-none{padding:18px 12px;text-align:center;color:var(--ink-3);font-size:13px}
.ms-foot{display:flex;gap:8px;padding:8px;border-top:1px solid var(--line-2);background:#FAFCFF}
.ms-foot button{flex:1;height:36px;border-radius:9px;font-size:13px;font-weight:600}
.ms-clr{background:#fff;border:1.5px solid var(--line);color:var(--ink-2)}
.ms-clr:hover{border-color:var(--danger);color:var(--danger)}
.ms-ok{background:var(--blue-600);color:#fff}
.ms-scrim{position:fixed;inset:0;background:rgba(10,31,60,.4);z-index:70;display:none}
.ms-scrim.show{display:block}
.frow2{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;cursor:pointer;user-select:none}
.switch input{display:none}
.track{width:40px;height:23px;border-radius:999px;background:var(--line);position:relative;transition:.18s;flex:0 0 auto}
.track::after{content:'';position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;background:#fff;
  box-shadow:var(--sh-1);transition:.18s}
.switch input:checked + .track{background:var(--blue-600)}
.switch input:checked + .track::after{transform:translateX(17px)}
.linkbtn{color:var(--blue-600);font-weight:600;font-size:13.5px;text-decoration:none}
.linkbtn:hover{text-decoration:underline}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;height:29px;padding:0 6px 0 11px;border-radius:999px;
  background:var(--blue-50);border:1px solid var(--blue-100);color:var(--navy-700);font-size:12.5px;font-weight:500}
.chip b{font-weight:700}
.chip button{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.chip button:hover{background:#fff;color:var(--danger)}
.chip button svg{width:11px;height:11px}

/* ============================== TOOLBAR ================================= */
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 12px;
  position:sticky;top:0;z-index:38;background:var(--bg);
  padding:8px 0;box-shadow:0 8px 12px -10px rgba(14,23,38,.35)}
.tabs{display:inline-flex;background:#E9EEF7;border-radius:12px;padding:4px;gap:2px}
.tabs button{height:36px;padding:0 15px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:center;gap:7px;transition:.15s}
.tabs button svg{width:15px;height:15px}
.tabs button.on{background:#fff;color:var(--blue-600);box-shadow:var(--sh-1)}
.spacer{flex:1}
.resinfo{font-size:13.5px;color:var(--ink-2)}
.resinfo b{color:var(--ink);font-weight:700}
.sel-sm{height:36px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px;background:#fff;font-size:13.5px}
.btn-sm{height:36px;padding:0 13px;border-radius:10px;background:#fff;border:1.5px solid var(--line);
  font-size:13.5px;font-weight:600;color:var(--ink-2);display:inline-flex;align-items:center;gap:7px}
.btn-sm:hover{border-color:var(--blue-500);color:var(--blue-600)}
.btn-sm svg{width:15px;height:15px}

/* ============================== SUMMARY STRIP =========================== */
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--sh-1)}
.st .s-l{font-size:11.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px}
.st .s-l svg{width:13px;height:13px}
.st .s-v{font-size:19px;font-weight:700;margin-top:2px;letter-spacing:-.2px}

/* ============================== RESULTS ================================= */
.list{display:grid;gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);
  transition:.15s;overflow:hidden}
.card:hover{box-shadow:var(--sh-2);border-color:#D3DEEE}
.card-main{display:flex;align-items:center;gap:13px;padding:13px 14px;cursor:pointer}
.thumb{width:52px;height:52px;border-radius:13px;flex:0 0 auto;display:grid;place-items:center;
  color:#fff;position:relative;overflow:hidden}
.thumb svg{width:26px;height:26px;position:relative;z-index:2}
.thumb .init{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;font-weight:800;
  letter-spacing:.5px;opacity:.92;z-index:2;line-height:1}
.thumb.has-init svg{margin-top:-6px}
.thumb.logo{background:#fff;border:1px solid var(--line)}
.thumb.logo::after{display:none}
.thumb.logo img{width:74%;height:74%;object-fit:contain;display:block}
.thumb::after{content:'';position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.28),rgba(255,255,255,0) 60%)}
.c-body{min-width:0;flex:1}
.c-title{font-size:14.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;height:21px;padding:0 8px;border-radius:6px;
  font-size:11px;font-weight:600;background:var(--line-2);color:var(--ink-2);white-space:nowrap}
.tag.code{background:#EEF2F8;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tag.brand{background:var(--blue-50);color:var(--blue-600)}
.tag.st-current{background:var(--ok-bg);color:var(--ok)}
.tag.st-npi,.tag.st-new{background:var(--violet-bg);color:var(--violet)}
.tag.st-pre{background:var(--warn-bg);color:var(--warn)}
.tag.st-eol{background:var(--danger-bg);color:var(--danger)}
.c-right{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.qty{font-size:21px;font-weight:800;line-height:1;letter-spacing:-.4px}
.qty.low{color:var(--warn)} .qty.last{color:var(--danger)} .qty.ok{color:var(--ok)}
/* Cover Week */
.cw{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:7px;
  font-size:11.5px;font-weight:700;white-space:nowrap}
.cw i{width:6px;height:6px;border-radius:50%;background:currentColor;font-style:normal}
.cw-crit {background:var(--danger-bg);color:var(--danger)}
.cw-ok   {background:var(--ok-bg);color:var(--ok)}
.cw-watch{background:var(--warn-bg);color:var(--warn)}
.cw-over {background:var(--violet-bg);color:var(--violet)}
.cw-none {background:#EFF3F9;color:var(--ink-3)}
.cwbig{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.1}
.cwbig small{font-size:11px;font-weight:600;opacity:.75;margin-left:3px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);
  border-radius:var(--r);padding:10px 13px;margin-bottom:12px;font-size:12px;color:var(--ink-2);box-shadow:var(--sh-1)}
.legend b{font-weight:700;color:var(--ink);margin-right:2px}
.c-right .sub{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.c-right .price{font-size:12px;font-weight:500;color:var(--ink-3);white-space:nowrap}
.c-right .valsum{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;margin-top:1px}
.caret{width:18px;height:18px;color:var(--ink-3);transition:.2s;flex:0 0 auto}
.card.open .caret{transform:rotate(180deg)}

/* expand */
.c-detail{display:none;border-top:1px dashed var(--line);background:#FAFCFF;padding:4px 0}
.card.open .c-detail{display:block}
.drow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-2)}
.drow:last-child{border-bottom:0}
.dnum{width:24px;height:24px;border-radius:7px;background:var(--blue-50);color:var(--blue-600);
  font-size:11px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.dmain{min-width:0;flex:1}
.dmain .n{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dmain .m{font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dright{flex:0 0 auto;text-align:right;line-height:1.25}
.dqty{font-size:16px;font-weight:700;flex:0 0 auto}
.dval{font-size:11px;font-weight:600;color:var(--ink-3);white-space:nowrap;margin-top:2px}
.dloading{padding:16px;text-align:center;color:var(--ink-3);font-size:13px}
/* รายการยาว: จำกัดความสูงให้เลื่อนในกรอบตัวเอง ไม่ดันหน้าเว็บยืดยาว */
.dlist{max-height:min(64vh,620px);overflow-y:auto;overscroll-behavior:contain}
.dfind{padding:0 14px 9px;position:relative}
.dfind input{width:100%;height:34px;border:1.5px solid var(--line);border-radius:9px;padding:0 34px 0 11px;
  background:#fff;font-size:12.5px}
.dfind input:focus{outline:none;border-color:var(--blue-500);box-shadow:0 0 0 3px var(--blue-100)}
.dfind .dclear{position:absolute;right:6px;top:3px;width:28px;height:28px;border-radius:8px;display:none;
  place-items:center;color:var(--ink-3)}
.dfind .dclear:hover{background:var(--line-2);color:var(--ink)}
.dfind.has .dclear{display:grid}
.dfoot{padding:9px 14px;text-align:center;font-size:11px;color:var(--ink-3);border-top:1px dashed var(--line)}
.dfoot .dmore{color:var(--blue-600);font-weight:600}
.dempty{padding:16px}

/* table (desktop, flat view) */
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1);overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;font-size:13.5px;min-width:840px}
table.grid th{background:#F7F9FD;text-align:left;font-size:10.5px;font-weight:800;
  letter-spacing:.6px;color:var(--ink-2);padding:10px 12px;border-bottom:1.5px solid var(--line);
  white-space:nowrap}
table.grid th.sortable{cursor:pointer;user-select:none;transition:.12s}
table.grid th.sortable:hover{background:var(--blue-50);color:var(--blue-600)}
table.grid th.on{color:var(--blue-600);box-shadow:inset 0 -2px 0 var(--blue-500)}
table.grid th .sar{display:inline-block;margin-left:5px;font-size:9px;opacity:.35;vertical-align:1px}
table.grid th.on .sar{opacity:1}
/* ปุ่มเรียงในรายการที่กางออกมา */
.dsort{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:9px 14px 7px;
  font-size:11.5px;font-weight:600;color:var(--ink-3)}
.dsort button{height:26px;padding:0 11px;border-radius:8px;background:#fff;border:1.5px solid var(--line);
  font-size:11.5px;font-weight:600;color:var(--ink-2)}
.dsort button:hover{border-color:var(--blue-500);color:var(--blue-600)}
.dsort button.on{background:var(--blue-600);border-color:var(--blue-600);color:#fff}
table.grid th.num{text-align:right}
table.grid td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
table.grid tbody tr:last-child td{border-bottom:0}
table.grid tbody tr:hover{background:var(--blue-50)}
table.grid td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.grid td.b{font-weight:700}
table.grid .pn{font-weight:600;color:var(--ink);line-height:1.4}
table.grid .pm{font-size:11px;color:var(--ink-3);line-height:1.4;margin-top:1px}
table.grid .bal{font-weight:800;font-size:15px}
/* ป้ายบอกบริบทเหนือผลลัพธ์ */
.sect{font-size:10.5px;font-weight:800;letter-spacing:.7px;color:var(--ink-3);margin:0 2px 7px}

/* states */
.skel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;
  display:flex;gap:13px;align-items:center}
.sk{background:linear-gradient(90deg,#EDF1F7 25%,#F6F8FC 37%,#EDF1F7 63%);background-size:400% 100%;
  animation:sh 1.2s ease infinite;border-radius:8px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
.empty{background:#fff;border:1px dashed var(--line);border-radius:var(--r-lg);padding:44px 20px;text-align:center}
.empty svg{width:132px;height:104px;margin-bottom:8px}
.empty h3{margin:6px 0 4px;font-size:17px;font-weight:700}
.empty p{margin:0;color:var(--ink-3);font-size:13.5px}
.errbox{background:var(--danger-bg);border:1px solid #F6CACA;border-radius:var(--r);
  padding:14px 16px;color:var(--danger);font-size:13.5px;line-height:1.6}
.errbox b{display:block;margin-bottom:3px;font-size:14.5px}
.more{display:flex;justify-content:center;margin:16px 0 30px}
.more button{height:44px;padding:0 26px;border-radius:999px;background:#fff;border:1.5px solid var(--line);
  font-weight:600;color:var(--ink-2);box-shadow:var(--sh-1)}
.more button:hover{border-color:var(--blue-500);color:var(--blue-600)}

/* toast */
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);z-index:99;
  background:var(--navy-900);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;
  box-shadow:var(--sh-3);opacity:0;transition:.28s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0);opacity:1}

footer{padding:24px 0 34px;text-align:center;color:var(--ink-3);font-size:12px}

/* ============================== RESPONSIVE ============================== */
@media (max-width:1000px){
  .searchrow{grid-template-columns:1fr auto}
  .searchrow .field.shop{grid-column:1 / -1;order:3}
}
/* มือถือ + แท็บเล็ตแนวตั้ง: ตัวกรองเปิดเป็น bottom sheet + เป้าแตะใหญ่ขึ้น */

  .ms-head{display:flex}
  .ms-list{max-height:48vh;padding:2px 8px 8px}
  .ms-opt{padding:12px 10px;font-size:14.5px;gap:11px}

  .ms-box svg{width:13px;height:13px}
  .ms-search input{height:44px}
  .ms-foot{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .ms-foot button{height:44px;font-size:14px}
  .ms-btn{height:56px}
  .fgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:520px){ .fgrid{grid-template-columns:1fr} }
@media (max-width:760px){
  body{font-size:14.5px}
  .wrap{padding:0 12px}
  .hero{padding:16px 0 58px}
  .hero-title h2{font-size:18px}
  .kpis{grid-template-columns:1fr 1fr;gap:9px}
  .kpi .k-val{font-size:19px}
  .strip{grid-template-columns:1fr 1fr}
  .searchrow{grid-template-columns:1fr}
  .searchrow .field.shop{order:initial}
  .btn{height:46px}
  .field input{height:46px}
  .toolbar{gap:8px}
  .tabs{width:100%}
  .tabs button{flex:1;justify-content:center;padding:0 4px;font-size:12px;gap:5px}
  .tabs button svg{width:15px;height:15px}
  .resinfo{order:9;width:100%;margin-top:-2px}
  .sel-sm{flex:1;min-width:0}
  .thumb{width:46px;height:46px;border-radius:12px}
  .thumb svg{width:23px;height:23px}
  .qty{font-size:19px}
  .brandtxt p{display:none}
  .pill.built{display:none}

@media (max-width:400px){
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .c-title{-webkit-line-clamp:3}
  .tabs button span{display:none}
}

/* =====================================================================
 * v2 THEME — หน้าค้นหาสต็อก (โทนอ่อน · ฟอนต์ Noto Sans Thai · ปุ่มพื้นอ่อนตัวเข้ม)

:root{
  --navy-900:#18263A; --navy-800:#33445A; --navy-700:#33445A;
  --blue-600:#2F5E9E; --blue-500:#4A78B8; --blue-100:#DCE6F2; --blue-50:#EEF3FA;
  --ink:#18263A; --ink-2:#33445A; --ink-3:#5A6A7E;
  --line:#E2E7EE; --line-2:#EDF1F6; --bg:#F3F5F8;
  --ok:#1E6B45; --ok-bg:#E8F4EC; --warn:#8C5A06; --warn-bg:#FBF0DA;
  --danger:#A8261F; --danger-bg:#FCEBE9; --violet:#4A3B9C; --violet-bg:#EEEBFA;
  --red:#B4232F; --red-bg:#FCEDEE; --red-line:#F2C9CD;
  --head:#EDF1F6; --head-ink:#33445A;
}
body{font-family:'Noto Sans Thai',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-feature-settings:normal;
  font-variant-numeric:tabular-nums}

  background:rgba(255,255,255,.6);border:1px solid var(--line)}
.hero2 .tabs button,.scope button{height:42px;padding:0 16px;border-radius:12px;font-size:15px;font-weight:500;
  color:#4A5A6E;border:1px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.hero2 .tabs button svg{width:17px;height:17px}
.hero2 .tabs button.on,.scope button.on{background:#fff;color:var(--red);font-weight:600;border-color:var(--red-line);
  box-shadow:0 8px 18px -10px rgba(180,35,47,.45)}
.scope button{font-size:14px;font-weight:600;color:var(--ink-2)}
.scope button span{font-size:12px;font-weight:400;color:var(--ink-3)}
.scope button.on span{color:var(--red)}

/* ---------- results head + facts ---------- */
.reshead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:22px 0 14px}
#resHead{margin:0;font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.reshead .strip{display:flex;flex-wrap:wrap;gap:8px;margin:0}
.fact{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 6px;border-radius:18px;
  background:#fff;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.fact .fi{width:26px;height:26px;border-radius:13px;display:grid;place-items:center}
.fact .fi svg{width:14px;height:14px}
.fact span{color:var(--ink-3)} .fact b{font-weight:600}
body.mode-hall .reshead .strip{display:grid;width:100%;margin-bottom:4px}
.st{border-radius:14px;border-color:var(--line)}

/* ---------- filter bar ---------- */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.fbar .fbtn{display:none}
.fbar .filters,.fbar .filters.open{display:block;margin:0;padding:0;border:0}
.fbar .fgrid{display:flex;flex-wrap:wrap;gap:8px}
.fbar .ms-btn{height:46px;width:auto;min-width:126px;max-width:240px;border-radius:12px;border:1px solid #D9E0EA;padding:0 10px 0 14px;gap:8px}
.ms-lbl{font-size:11px;font-weight:500;letter-spacing:0;color:var(--ink-3)}
.ms-val{font-size:13px;font-weight:500}
.ms.has .ms-btn{border-color:var(--red-line);background:var(--red-bg)}
.ms.has .ms-val{color:var(--red)}
.ms.open .ms-btn{border-color:#D98A93;box-shadow:0 0 0 3px #FCE3E5}
.ms-cnt{background:#fff;color:var(--red);border:1px solid var(--red-line)}
.ms-pop{min-width:280px;border-radius:16px}
.ms-ok{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.lowsw{height:46px;padding:0 14px;border-radius:12px;background:#fff;border:1px solid #D9E0EA;font-size:13px;font-weight:500}
.switch input:checked + .track{background:#D98A93}
.sortlbl{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.fbar .sel-sm{height:46px;border-radius:12px;border:1px solid #D9E0EA;padding:0 12px;font-size:13px;color:var(--ink)}
.fbar .btn-sm.csv{height:46px;padding:0 16px;border-radius:12px;border:1px solid #C9D7EC;background:var(--blue-50);color:var(--blue-600);font-weight:500}
.chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px;min-height:8px}
.chiprow .chips{margin:0}
.chip{background:var(--line-2);border:1px solid var(--line);color:var(--ink-2)}
.chip b{font-weight:500;color:var(--ink-3)}
.chiprow .linkbtn{font-size:13px;color:var(--blue-600);font-weight:500;cursor:pointer}
.chiprow .resinfo{margin-left:auto;font-size:12px;color:var(--ink-3)}
body.mode-hall .chiprow{display:none !important}

/* ---------- product list (ตารางผลค้นหา) ---------- */
.plist{display:block;background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  box-shadow:0 1px 2px rgba(24,38,58,.04),0 18px 40px -24px rgba(24,38,58,.28)}
.plist .lhead,.plist .card-main{display:grid;align-items:center;column-gap:12px;
  grid-template-columns:14px minmax(230px,2.4fr) minmax(70px,.9fr) minmax(96px,1.1fr) minmax(90px,1fr) 62px 76px 86px 66px 104px 74px 96px}
.plist .lhead{background:var(--head);color:var(--head-ink);font-size:12.5px;font-weight:600;padding:12px 16px;line-height:1.3}
.plist .lhead .r,.plist .x-r{text-align:right}
.plist .card{border:0;border-radius:0;box-shadow:none;border-top:1px solid #E8ECF2;overflow:visible}
.plist .card:hover{box-shadow:none;background:#FAFBFD}
.plist .card.open{background:#F8FAFC}
.plist .card-main{padding:10px 16px;gap:0 10px}
.plist .lhead{column-gap:10px}
.fbar.panel{margin-top:0;z-index:40}
.x-car .caret{width:14px;height:14px;transform:rotate(-90deg);color:#8796A8}
.plist .card.open .x-car .caret{transform:rotate(0)}
.x-prod{display:flex;align-items:center;gap:12px;min-width:0}
.x-prod .c-title{font-size:14px;font-weight:600;line-height:1.35}
.x-prod .c-code{font-size:12px;color:var(--ink-3);margin-top:2px}
.x-prod .c-code .msub{display:none}
.x-br,.x-md,.x-vr,.x-pr,.x-sh,.x-val,.x-aws{font-size:13px}
.x-md{line-height:1.35}
.x-vr{display:flex;align-items:center;gap:6px;min-width:0}
.x-vr em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #B8C2CF}
.sw.none{border-style:dashed;background:transparent}
.x-qty .qn{font-size:17px;font-weight:600;line-height:1.1}
.x-qty .qn.low{color:var(--warn)} .x-qty .qn.last{color:var(--danger)}
.qbar{width:72px;height:4px;border-radius:2px;background:var(--line-2);margin:5px 0 0 auto;overflow:hidden}
.qbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,#E7B9BE,#C9606B)}
.x-cw .cwv{display:inline-block;min-width:52px;text-align:center;padding:3px 10px;border-radius:8px;font-size:13px;font-weight:600}
.cwv.cw-crit{color:var(--danger);background:var(--danger-bg)} .cwv.cw-ok{color:var(--ok);background:var(--ok-bg)}
.cwv.cw-watch{color:var(--warn);background:var(--warn-bg)} .cwv.cw-over{color:var(--violet);background:var(--violet-bg)}
.cwv.cw-none{color:var(--ink-3);background:transparent;font-weight:500;min-width:0;padding:0}
.x-dash{color:#A3AFBD}
.ml{display:none}
.mbreak{display:none}
.tag{height:22px;border-radius:7px;font-size:11.5px}
.tag.st-npi,.tag.st-new{background:var(--red-bg);color:var(--red)}
.tag.brand{background:var(--blue-50);color:var(--blue-600)}

/* soft thumbnails */
.thumb{width:44px;height:44px;border-radius:13px}
.thumb::after{display:none}
.thumb svg{width:21px;height:21px}
.thumb .init{font-size:7.5px;bottom:4px}

/* ---------- drill-down (สาขาที่มีของ) ---------- */
.c-detail{border-top:1px solid var(--line);background:#F8FAFC;padding:6px 0 4px}
.plist .c-detail{padding-left:58px}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding:4px 16px 12px;align-content:start}
.drow{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;
  box-shadow:0 6px 16px -12px rgba(24,38,58,.3);border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:1px solid var(--line)}
.dnum{background:var(--line-2);color:var(--ink-3);border-radius:8px}
.dmain .n{font-weight:600;white-space:normal;line-height:1.35}
.dmain .m{white-space:normal;line-height:1.4;margin-top:2px}
.dright{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.dqty{min-width:40px;text-align:center;padding:2px 8px;border-radius:9px;font-size:18px;font-weight:700;background:var(--line-2)}
.dqty.low{background:var(--warn-bg)}
.ty{display:inline-block;padding:0 7px;border-radius:6px;font-size:11px;font-weight:500;line-height:18px}
.dtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.ty-hall{color:#7A5A3C;background:#F5EEE6} .ty-m{color:#2F5E9E;background:#EEF3FA} .ty-n{color:#4D5B6C;background:#EDF1F6}
.dsort button.on{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.dfoot{border-top:0}

/* ---------- ปรับสีปุ่มทึบเดิมให้เป็นโทนอ่อน ---------- */
.btn-primary{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);box-shadow:none}
#hallMall button.on{background:#fff;color:var(--true);border:1px solid #C9D7EC;box-shadow:var(--sh-1)}
.seg{background:var(--line-2)}
.seg button.on{color:var(--red)}
table.grid th{background:var(--head);color:var(--head-ink);font-size:12px;font-weight:600;letter-spacing:0}
.tablewrap{border-radius:16px}
.card{border-radius:16px}
.more button{border-radius:12px;border:1px solid #D9E0EA}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .plist .lhead{display:none}
  .plist .card-main{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:14px}
  .x-car{display:none}
  .x-prod{flex:1 1 calc(100% - 110px);order:1}
  .x-prod .c-code .msub{display:inline}
  .x-qty{order:2;flex:0 0 auto;text-align:right}
  .x-qty .qn{font-size:24px;font-weight:700}
  .x-qty .qbar{display:none}
  .x-qty .ml{display:block;font-size:11px;color:var(--ink-3)}
  .x-vr,.x-md,.x-st{order:3;flex:0 0 auto;font-size:12px;padding:3px 8px;border-radius:7px;background:var(--bg)}
  .x-st{background:none;padding:0}
  .x-pr{order:4;margin-left:auto;font-weight:600;color:var(--red);font-size:13px}
  .x-br,.x-sh{display:none}
  .mbreak{display:block;order:5;flex-basis:100%;height:0;border-top:1px solid var(--line-2)}
  .x-val,.x-aws{order:6;font-size:12px;color:var(--ink-3)}
  .x-cw{order:7;margin-left:auto}
  .ml{display:inline}
  .x-val.x-r,.x-aws.x-r,.x-cw.x-r{text-align:left}
  .plist .c-detail{padding-left:0}
}
@media (max-width:760px){
  .hero2{padding:14px 0 12px}
  .hero2 .wrap{gap:12px}
  .h2title h2{font-size:22px}
  .h2title span{display:none}
  .live{height:28px;padding:0 10px;font-size:12px}
  .brand2 span{display:none}
  .field.big input{height:58px;border-radius:18px;font-size:18px;padding:0 100px 0 48px}
  .field.big>svg.lead{left:16px;width:20px;height:20px}
  .field.big .go{height:46px;padding:0 16px;border-radius:13px}
  .field.big .clear{display:none !important}
  .searchrow2 .field.shop{flex:1 1 100%}
  .searchrow2 .field.shop input{height:46px;border-radius:14px}
  .hero2 .tabs{order:2;width:100%;flex-wrap:nowrap;overflow-x:auto;background:none;border:0;padding:0 0 2px}
  .hero2 .tabs button{flex:none;height:40px;padding:0 14px;font-size:14px;background:rgba(255,255,255,.6);border-color:var(--line)}
  .hero2 .tabs button span{display:inline}
  .scope{order:1;width:100%;display:grid;grid-template-columns:repeat(3,1fr)}
  .scope button{flex-direction:column;justify-content:center;gap:0;height:46px;padding:0 4px;line-height:1.2}
  #resHead{font-size:20px}
  .live .lp{display:none}
  .reshead .strip{flex-wrap:nowrap;overflow-x:auto;width:calc(100% + 24px);margin:0 -12px;padding:0 12px 2px}
  .fact{flex:none}
  .reshead{margin:14px 0 10px;gap:8px}
  .fbar{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 8px;padding:0 12px 4px}
  .fbar .fgrid{flex-wrap:nowrap}
  .fbar .ms-btn{min-width:118px}
  .fbar>*{flex:none}
  .fbar .spacer{display:none}
  .dlist{grid-template-columns:1fr;padding:4px 10px 10px}
}

/* =====================================================================
 * v2 DTAC Hall — DTAC = ฟ้า · True = ชมพูอมแดง (ไม่ใช้แดงตรง ๆ เพื่อไม่สับสนกับ "ขาด")
 * ===================================================================== */
:root{
  --hall:#2F5E9E; --hall-bg:#EEF3FA; --hall-line:#DCE6F2; --hall-bar:#A9BEDB;
  --true:#A3305C; --true-bg:#FBEDF2; --true-line:#EFC8D6; --true-bar:#E2A6BE;
}
.ty-hall,.ty-coco{color:#2F5E9E;background:#EEF3FA}
.ty-m{color:#A3305C;background:#FBEDF2}
.ty-n{color:#8A4A64;background:#F6EFF2}
body.mode-hall .reshead .strip{display:none}
.hall-ctl{margin-bottom:12px;align-items:flex-start}
.seg2{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:12px;background:#fff;border:1px solid var(--line)}
.seg2 button{height:32px;padding:0 12px;border-radius:9px;font-size:13px;color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.seg2 button.on{background:var(--red-bg);color:var(--red);border-color:var(--red-line);font-weight:600}
#hallMall button.g7btn{border:1px dashed #C9D3E0}
#hallMall button.g7btn.on{background:var(--hall-bg);color:var(--hall);border:1px solid var(--hall-line)}
/* KPI */
.hall-kpi{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}
.hk{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hk-l{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hk-i{width:22px;height:22px;border-radius:11px;display:grid;place-items:center;flex:none}
.hk-i svg{width:12px;height:12px}
.hk-v{font-size:20px;font-weight:700;line-height:1.2;color:var(--ink)}
.hk-v small{font-size:14px;font-weight:700;color:inherit}
.hk-s{font-size:11.5px;color:var(--ink-3)}
.k-hall .hk-i{color:var(--hall);background:var(--hall-bg)}
.k-true .hk-i{color:var(--true);background:var(--true-bg)}
.k-share .hk-i{color:var(--ink-2);background:var(--line-2)}
.k-oos .hk-i{color:var(--danger);background:var(--danger-bg)} .k-oos .hk-v{color:var(--danger)}
.k-ns .hk-i{color:var(--violet);background:var(--violet-bg)} .k-ns .hk-v{color:var(--violet)}
/* การ์ดห้าง */
.hall-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.hall-cards.one{grid-template-columns:minmax(0,560px)}
.hm2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 14px 30px -24px rgba(24,38,58,.35);min-width:0}
.hm2-h{display:flex;align-items:center;gap:8px}
.hm2-h b{font-size:15px;font-weight:700}
.hm2-h .rg{padding:1px 8px;border-radius:7px;background:var(--line-2);color:var(--ink-2);font-size:11px;font-weight:600}
.hm2-h .sh{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap}
.hm2-h .sh b{font-size:13px;color:var(--hall)}
.hm2-bar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:#E7EDF4}
.hm2-bar i{display:block;height:100%}
.hm2-bar .bt{background:var(--true-bar)} .hm2-bar .bh{background:var(--hall-bar)}
.hm2-box{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.hbx{border-radius:11px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.hbx-true{background:var(--true-bg);border:1px solid var(--true-line)}
.hbx-hall{background:var(--hall-bg);border:1px solid var(--hall-line)}
.hbx-t{font-size:12px;font-weight:600}
.hbx-true .hbx-t{color:var(--true)} .hbx-hall .hbx-t{color:var(--hall)}
.hbx-v{font-size:18px;font-weight:700;line-height:1.2;color:var(--ink)}
.hbx-v small{font-size:11px;font-weight:400;color:var(--ink-3)}
.hbx-r{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:11px;color:var(--ink-3)}
.hbx-r span{white-space:nowrap}
.cwp{padding:0 6px;border-radius:6px;font-weight:600}
.cwp.cw-crit{color:var(--danger);background:var(--danger-bg)} .cwp.cw-ok{color:var(--ok);background:var(--ok-bg)}
.cwp.cw-watch{color:var(--warn);background:var(--warn-bg)} .cwp.cw-over{color:var(--violet);background:var(--violet-bg)}
.cwp.cw-none{color:var(--ink-3);background:var(--line-2)}
.hbx-s{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm2-sl{font-size:11px;color:var(--ink-3);margin-bottom:-4px}
.hm2-st{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hst{display:flex;flex-direction:column;align-items:flex-start;padding:5px 9px;border-radius:10px;text-align:left;border:1px solid transparent;cursor:pointer;min-width:0}
.hst span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.hst b{font-size:15px;font-weight:700;line-height:1.2}
.hst b small{font-size:11px;font-weight:400;color:var(--ink-3)}
.hst:hover{border-color:currentColor}
.s-oos{background:var(--danger-bg);color:var(--danger)} .s-low{background:var(--warn-bg);color:var(--warn)}
.s-over{background:var(--violet-bg);color:var(--violet)} .s-ns{background:#EDF1F6;color:#4D5B6C}
/* แถวตัวกรองตาราง */
.hall-ctl3{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:8px;scroll-margin-top:12px}
.hall-h{font-size:16px;font-weight:700;margin-right:6px}
.hv-chips{display:flex;flex-wrap:wrap;gap:6px}
.hv{height:34px;padding:0 12px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.hv span{margin-left:4px;padding:1px 7px;border-radius:8px;background:var(--line-2);font-size:11.5px;color:var(--ink-2)}
.hv.on{font-weight:600}
.hv-all.on{background:var(--red-bg);color:var(--red);border-color:var(--red-line)} .hv-all.on span{background:#fff;color:var(--red)}
.hv-act.on{background:var(--danger-bg);color:var(--danger);border-color:#F2C8C3} .hv-act.on span{background:#fff;color:var(--danger)}
.hv-over.on{background:var(--violet-bg);color:var(--violet);border-color:#D9D2F3} .hv-over.on span{background:#fff;color:var(--violet)}
.hv-ns.on{background:#EDF1F6;color:#33445A;border-color:#D5DDE7} .hv-ns.on span{background:#fff}
.hall-sp{flex:1}
.hall-lb{font-size:12.5px;color:var(--ink-3)}
#hallPick{height:34px;min-width:190px;border-radius:10px}
.hall-q{flex:0 1 260px;min-width:200px}
.hall-q input{height:34px}
.hall-ctl4{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.hall-csv{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;font-size:12.5px;
  color:var(--hall);background:var(--hall-bg);border:1px solid var(--hall-line)}
.hall-csv svg{width:14px;height:14px}
.hall-note{font-size:11.5px;color:var(--ink-3);margin-left:4px}
/* ตารางเทียบรายรุ่น */
#hallTable .tablewrap{border-radius:14px;border:1px solid var(--line);box-shadow:none}
table.grid.hall th{background:var(--head);color:var(--head-ink)}
table.grid.hall th.hm{background:var(--head);color:var(--ink);font-size:13.5px;font-weight:700;letter-spacing:0;border-left:2px solid #fff;padding:7px 6px 2px}
table.grid.hall th.hm span{opacity:1;font-weight:400;font-size:11.5px;color:var(--ink-3)}
table.grid.hall th.hm-true{background:var(--true-bg);color:var(--true)}

table.grid.hall th.hs .hpill{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11.5px;line-height:1.5}

<script>
/* =========================================================================
 * Check Stock Balance Daily — Client
 * ไม่มี raw data ฝั่ง browser: ทุกการค้นหาเรียก google.script.run
 * ======================================================================= */

var BOOT = null;
var STATE = {
  q:'', shopQ:'', area:[], stype:[], shop:[], cat:[], brand:[], model:[], status:[],
  maxQty:0, group:'product', sort:'qty', dir:'desc', page:0, pageSize:50
};
var LAST = { total:0, items:[] };
var reqSeq = 0;

/* ---------------------------- helpers --------------------------------- */
var $ = function(id){ return document.getElementById(id); };
function nf(n){ return (Number(n)||0).toLocaleString('th-TH'); }
function money(n){
  n = Number(n)||0;
  if (n >= 1e9) return (n/1e9).toFixed(2)+' พัน ล.';
  if (n >= 1e6) return (n/1e6).toFixed(1)+' ล.';
  if (n >= 1e3) return Math.round(n/1e3)+' K';
  return nf(n);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); },2600);
}
function call(fn, arg){
  return new Promise(function(res, rej){
    google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);
  });
}

/* ---------------------- visual mapping (icons/colors) ------------------ */
var CAT_ICON = {
  'APPLE IPHONE':'c-phone','INTER BRAND':'c-phone','HOUSE BRAND':'c-phone',
  'APPLE IPAD':'c-tablet','ACCESSORIES':'c-acc','GADGET':'c-gadget',
  'IOT':'c-iot','SCRATCH CARD':'c-card','PREMIUM':'c-gift','AFS':'c-pkg','TRUE DIGITAL HD':'c-iot'
};
var BRAND_HUE = {
  'APPLE':212,'IPHONE':212,'IPAD':212,'SAMSUNG':224,'XIAOMI':22,'OPPO':148,'VIVO':205,
  'HONOR':196,'HUAWEI':2,'REALME':48,'INFINIX':268,'NOTHING':0,'BASEUS':240,'FOCUS':318,
  'MONCHI':334,'VEGER':170,'ASAKI':14,'GIZMO':262,'HISHIELD':186,'LDNIO':32,'IMOO':290,
  'SHOKZ':98,'NINTENDO':354,'GARMIN':204,'SKG':126,'ALPHA':252,'TRUEX':350,'SUPLIFE':160,'WHY':60
};
function hueOf(s){
  s = String(s||'');
  if (BRAND_HUE[s] != null) return BRAND_HUE[s];
  var h=0; for (var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360;
  return h;
}
function thumb(cat, brand){
  var lg = BOOT && BOOT.logos && BOOT.logos[brand];
  if (lg) return '<div class="thumb logo"><img src="'+lg+'" alt="'+esc(brand)+'" loading="lazy"></div>';
  var h = hueOf(brand);
  var ic = CAT_ICON[cat] || 'c-pkg';
  var init = String(brand||'').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase();
  return '<div class="thumb'+(init?' has-init':'')+'" style="background:linear-gradient(145deg,hsl('+h+',80%,98%),hsl('+h+',55%,91%));color:hsl('+h+',45%,36%);border:1px solid hsl('+h+',45%,85%)">'+
         '<svg><use href="#'+ic+'"/></svg>'+(init?'<span class="init">'+init+'</span>':'')+'</div>';
}
/* ลำดับ AREA ตามโครง REGION › AREA ที่ใช้จริง (BMA 5 · UPC I 5 · UPC II 5) */
var AREA_GROUPS = [
  { g:'BMA',   areas:['BMA I - North West','BMA II - South West','BMA III - North East',
                      'BMA IV - South East','BMA V - Central'] },
  { g:'UPC I', areas:['UPC - Central','UPC - Central Northeast','UPC - Lower North',
                      'UPC - Upper North','UPC - Upper Northeast'] },
  { g:'UPC II',areas:['UPC - East','UPC - Lower Northeast','UPC - Lower South',
                      'UPC - Upper South','UPC - West'] }
];
var AREA_ORDER = [], AREA_OF_GROUP = {};
AREA_GROUPS.forEach(function(x){
  x.areas.forEach(function(a){ AREA_ORDER.push(a); AREA_OF_GROUP[a] = x.g; });
});
/* ลำดับสถานะสินค้าตามวงจรชีวิต ไม่ใช่ตามจำนวน */
var STATUS_ORDER = ['CURRENT','NEW PRODUCT','NPI','SPECIAL PROMOTION','PRE-EOL','EOL','ไม่ระบุ'];

var AREA_PAL = [212,262,196,330,20,152,178,286,238,204,344,116,300,168,228];
var AREA_HUE = {};
function shopThumb(area){
  var h = AREA_HUE[area] != null ? AREA_HUE[area] : hueOf(area);
  return '<div class="thumb" style="background:linear-gradient(145deg,hsl('+h+',80%,98%),hsl('+h+',55%,91%));color:hsl('+h+',45%,36%);border:1px solid hsl('+h+',45%,85%)">'+
         '<svg><use href="#i-shop"/></svg></div>';
}
function qtyCls(q){ return q<=1 ? 'last' : (q<=3 ? 'low' : 'ok'); }

/* เกณฑ์ DOI (Days of Inventory) มาตรฐานของทีม แปลงเป็นสัปดาห์
   < 7 วัน เสี่ยงขาดสต็อก · 7–20 ปกติ · 20–45 เฝ้าระวัง · > 45 สต็อกเกิน
   จุดตัดคิดจาก "วัน" ตรง ๆ เพื่อไม่ให้เพี้ยนจากการปัดเศษสัปดาห์ */
var DOI = { crit:7, ok:20, watch:45 };
var CW_VAR = { 'cw-crit':'danger', 'cw-ok':'ok', 'cw-watch':'warn',
               'cw-over':'violet', 'cw-none':'ink-3' };
function cwInfo(cw){
  if (cw==null) return {c:'cw-none', t:'No Sale', v:'—'};
  var d = cw * 7;                                  // สัปดาห์ -> วัน
  var v = cw > 99 ? '99+' : cw.toFixed(1);
  if (d <  DOI.crit)  return {c:'cw-crit',  t:'เสี่ยงขาดสต็อก', v:v};
  if (d <  DOI.ok)    return {c:'cw-ok',    t:'ปกติ',           v:v};
  if (d <= DOI.watch) return {c:'cw-watch', t:'เฝ้าระวัง',      v:v};
  return                     {c:'cw-over',  t:'สต็อกเกิน',      v:v};
}
function wk(days){ return (days/7).toFixed(1); }   // ใช้ในคำอธิบายเกณฑ์
function hasCover(cat){
  return !!(BOOT && BOOT.hasSales && BOOT.coverCats && BOOT.coverCats.indexOf(cat) >= 0);
}
function cwChip(cw, withWord){
  var i = cwInfo(cw);
  return '<span class="cw '+i.c+'" title="Cover Week = สต็อก ÷ ยอดขายเฉลี่ยต่อสัปดาห์ (Last 4 Weeks)"><i></i>'+
         (cw==null ? i.t : 'Cover '+i.v+' สัปดาห์'+(withWord?' · '+i.t:''))+'</span>';
}
function stTag(st){
  var s=String(st||'').toUpperCase(), c='';
  if (s.indexOf('CURRENT')===0) c='st-current';
  else if (s.indexOf('NPI')===0) c='st-npi';
  else if (s.indexOf('NEW')===0) c='st-new';
  else if (s.indexOf('PRE-EOL')===0) c='st-pre';
  else if (s.indexOf('EOL')===0) c='st-eol';
  return c ? '<span class="tag '+c+'">'+esc(st)+'</span>' : '';
}

/* ---------------------- v2: scope / recent / shop type ------------------ */
var SHOPTYPE = {};
function tyTag(sc){
  var t = SHOPTYPE[sc]; if (!t || t==='ไม่ระบุ') return '';
  var c = t==='DTAC HALL' ? 'ty-hall' : t==='DTAC COCO' ? 'ty-coco' : t==='Matching' ? 'ty-m' : 'ty-n';
  return ' <span class="ty '+c+'">'+esc(t)+'</span>';
}
function scopeSync(){
  var el=$('scope'); if(!el) return;
  var a = STATE.area.length===1 ? STATE.area[0] : (STATE.area.length ? null : '');
  el.querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', a!==null && b.getAttribute('data-a')===a); });
}
function getRecent(){ try { return JSON.parse(localStorage.getItem('cs_recent')||'[]'); } catch(e){ return []; } }
function saveRecent(q){
  q = String(q||'').trim(); if (q.length < 3) return;
  clearTimeout(saveRecent._t);
  saveRecent._t = setTimeout(function(){
    var l = getRecent().filter(function(x){ return x.toLowerCase()!==q.toLowerCase(); });
    l.unshift(q); l = l.slice(0,6);
    try { localStorage.setItem('cs_recent', JSON.stringify(l)); } catch(e){}
    renderRecent();
  }, 1500);
}
function renderRecent(){
  var l = getRecent(), el=$('recent'); if(!el) return;
  el.classList.toggle('hide', !l.length);
  el.innerHTML = '<span class="rl"><svg><use href="#i-clock"/></svg>ค้นหาล่าสุด</span>'+
    l.map(function(x){ return '<button type="button" data-r="'+esc(x)+'">'+esc(x)+'</button>'; }).join('');
}

/* ---------------------------- bootstrap -------------------------------- */
function init(){
  msBuild();
  bindUI();
  showSkeleton(6);
  call('apiBootstrap').then(function(r){
    if (!r.ok) return fail(r.error);
    BOOT = r;
    $('kShop').textContent = nf(r.summary.shops);
    $('kArea').textContent = r.areas.length + ' ภาค';
    $('kSku').textContent  = nf(r.summary.skus);
    $('kRows').textContent = nf(r.summary.rows) + ' แถวข้อมูล';
    $('kQty').textContent  = nf(r.summary.qty);
    $('kVal').textContent  = money(r.summary.value);
    $('builtTxt').innerHTML = '<span class="lp">ข้อมูลสต็อก ณ </span>' + esc(r.built);

/* ===================== multi-select dropdown component ===================== */
var MS = [
  { key:'area',   label:'ภาค / AREA',   ph:'ทุกภาค',      facet:'area'   },
  { key:'stype',  label:'ประเภทร้าน (SHOP TYPE)', ph:'ทุกประเภทร้าน', facet:'stype' },
  { key:'shop',   label:'สาขา',          ph:'ทุกสาขา',      facet:null     },
  { key:'cat',    label:'หมวดสินค้า',    ph:'ทุกหมวด',      facet:'cat'    },
  { key:'brand',  label:'แบรนด์',        ph:'ทุกแบรนด์',    facet:'brand'  },
  { key:'model',  label:'รุ่น (MODEL)',  ph:'ทุกรุ่น',       facet:'model'  },
  { key:'status', label:'สถานะสินค้า',   ph:'ทุกสถานะ',     facet:'status' }
];
var msOpen = null, msOrdered = false, msGuard = false;

function msDef(k){ for (var i=0;i<MS.length;i++) if (MS[i].key===k) return MS[i]; }
/** กำหนดลำดับตายตัวให้มิติที่มีลำดับเชิงธุรกิจ (ภาค / สถานะ) — ค่าที่ไม่อยู่ในลิสต์ต่อท้าย */
function msFixedOrder(key, fixed, all){
  var d = msDef(key); if (!d) return;
  d.order = {}; d.fixed = true;
  fixed.forEach(function(v,i){ d.order[v] = i; });
  (all||[]).slice().sort().forEach(function(v){ if (d.order[v]==null) d.order[v] = fixed.length + 1; });
}
function msBuild(){

  $('fgrid').innerHTML = MS.map(function(d){
    return '<div class="ms" id="ms-'+d.key+'">'+

        '<span class="ms-val ph" id="msv-'+d.key+'">'+esc(d.ph)+'</span></span>'+
        '<span class="ms-cnt hide" id="msc-'+d.key+'">0</span>'+
        '<svg class="ms-car"><use href="#i-down"/></svg>'+
      '</button>'+
      '<div class="ms-pop">'+
        '<div class="ms-head"><b>'+esc(d.label)+'</b><button data-close="'+d.key+'"><svg><use href="#i-x"/></svg></button></div>'+
        '<div class="ms-search"><input type="text" placeholder="ค้นหา…" data-msq="'+d.key+'" autocomplete="off"></div>'+
        '<div class="ms-list" id="msl-'+d.key+'"></div>'+
        '<div class="ms-foot"><button class="ms-clr" data-msclr="'+d.key+'">ล้าง</button>'+

  }).join('');

  $('fgrid').addEventListener('click', function(e){
    msGuard = true; setTimeout(function(){ msGuard = false; }, 0);   // กันไม่ให้ตัวจับ click นอกพื้นที่ปิด dropdown
    var b=e.target.closest('[data-ms]');   if (b) return msToggle(b.getAttribute('data-ms'));
    var c=e.target.closest('[data-close]');if (c) return msClose();

    var o=e.target.closest('.ms-opt');

      msSync(); search(true);

  });
  $('fgrid').addEventListener('input', function(e){
    var q=e.target.getAttribute('data-msq');
    if (q){ msDef(q).q = e.target.value.trim().toLowerCase(); msList(q); }
  });
  $('msScrim').addEventListener('click', msClose);
  document.addEventListener('click', function(e){
    if (msGuard || !msOpen) return;
    if (!e.target.closest('#ms-'+msOpen)) msClose();
  });
}
function msToggle(k){
  if (msOpen===k) return msClose();
  msClose();
  msOpen=k; $('ms-'+k).classList.add('open');
  var sheet = window.innerWidth<=900;
  $('msScrim').classList.toggle('show', sheet);
  document.body.classList.toggle('ms-sheet', sheet);
  msList(k);
  var q=document.querySelector('[data-msq="'+k+'"]');
  if (window.innerWidth>900 && q) setTimeout(function(){ q.focus(); },30);
}
function msClose(){
  if (msOpen) $('ms-'+msOpen).classList.remove('open');
  $('msScrim').classList.remove('show');
  document.body.classList.remove('ms-sheet');
  msOpen=null;
}
/** ตัวเลือกของแต่ละมิติ: [{v,t,n}] — สาขาผูกกับภาคที่เลือก */
function msOpts(k){
  if (!BOOT) return [];
  var d=msDef(k);
  if (k==='shop'){
    var list=BOOT.shops;
    if (STATE.area.length){ var s={}; STATE.area.forEach(function(a){s[a]=1;});
      list=list.filter(function(x){ return s[x.a]; }); }
    if (STATE.stype.length){ var ty={}; STATE.stype.forEach(function(a){ty[a]=1;});
      list=list.filter(function(x){ return ty[x.y]; }); }
    return list.map(function(x){ return {v:x.c,t:x.n,n:null}; });
  }
  var src = {area:BOOT.areas,stype:BOOT.stypes||[],cat:BOOT.cats,brand:BOOT.brands,model:BOOT.models,status:BOOT.statuses}[k]||[];
  var cnt = d.counts||{};
  return src.map(function(v){ return {v:v,t:v,n:cnt[v]==null?0:cnt[v]}; });
}
function msList(k){
  var d=msDef(k), q=d.q||'', sel=STATE[k], selSet={};
  sel.forEach(function(v){ selSet[v]=1; });
  var opts=msOpts(k);
  if (d.order){ var ix=d.order; opts.sort(function(a,b){ return (ix[a.v]==null?9e9:ix[a.v])-(ix[b.v]==null?9e9:ix[b.v]); }); }
  var vis=opts.filter(function(o){
    if (q && o.t.toLowerCase().indexOf(q)<0) return false;
    if (o.n===0 && !selSet[o.v]) return false;      // ไม่มีของจริงในเงื่อนไขนี้ -> ซ่อน
    return true;
  });
  var cap=vis.slice(0,300), lastGrp=null;
  $('msl-'+k).innerHTML = cap.length
    ? cap.map(function(o){
        var head='';
        if (k==='area'){                       // คั่นหัวข้อ REGION ให้เห็นโครงพื้นที่
          var g=AREA_OF_GROUP[o.v]||'อื่น ๆ';
          if (g!==lastGrp){ lastGrp=g; head='<div class="ms-grp">'+esc(g)+'</div>'; }
        }
        return head+'<div class="ms-opt'+(selSet[o.v]?' on':'')+'" data-k="'+k+'" data-v="'+esc(o.v)+'">'+
          '<span class="ms-box"><svg><use href="#i-check"/></svg></span>'+
          '<span class="ms-tx">'+esc(o.t)+'</span>'+
          (o.n==null?'':'<span class="ms-n">'+nf(o.n)+'</span>')+'</div>';
      }).join('') + (vis.length>cap.length
        ? '<div class="ms-none">แสดง 300 จาก '+nf(vis.length)+' รายการ — พิมพ์เพื่อค้นหาต่อ</div>' : '')
    : '<div class="ms-none">ไม่พบตัวเลือกที่ตรงกับเงื่อนไขปัจจุบัน</div>';
}
/** ตัดสาขาที่ไม่อยู่ในภาคที่เลือกออกจาก STATE */
function msPruneShops(){
  if (!BOOT || (!STATE.area.length && !STATE.stype.length)) return;
  var s={}, ty={}; STATE.area.forEach(function(a){s[a]=1;}); STATE.stype.forEach(function(a){ty[a]=1;});
  var ok={}; BOOT.shops.forEach(function(x){
    if((!STATE.area.length||s[x.a]) && (!STATE.stype.length||ty[x.y])) ok[x.c]=1; });
  STATE.shop = STATE.shop.filter(function(c){ return ok[c]; });
}
/** อัปเดตหน้าตาปุ่มทุกตัว + รายการที่เปิดอยู่ */
function msSync(){
  MS.forEach(function(d){
    var sel=STATE[d.key], n=sel.length;
    var v=$('msv-'+d.key), c=$('msc-'+d.key);
    if (!v) return;
    if (!n){ v.textContent=d.ph; v.classList.add('ph'); }
    else {
      v.classList.remove('ph');
      v.textContent = n===1 ? msLabelOf(d.key, sel[0]) : 'เลือกแล้ว '+n+' รายการ';
    }
    c.textContent=n; c.classList.toggle('hide', n===0);
    $('ms-'+d.key).classList.toggle('has', n>0);
  });
  if (msOpen) msList(msOpen);
}
function msLabelOf(k, v){
  if (k!=='shop' || !BOOT) return v;
  var s=BOOT.shops.filter(function(x){return x.c===v;})[0];
  return s ? s.n : v;
}

    b.addEventListener('click', function(){

    this.querySelectorAll('button').forEach(function(x){x.classList.remove('on');});

  });
  $('btnMore').addEventListener('click', function(){ STATE.page++; search(false); });

  $('btnRefresh').addEventListener('click', doRefresh);
  $('btnGo').addEventListener('click', function(){ clearTimeout(deb); STATE.q=$('q').value.trim(); search(true); });
  $('scope').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    var a=b.getAttribute('data-a');

    try { localStorage.setItem('cs_scope', a); } catch(err){}

  $('recent').addEventListener('click', function(e){
    var b=e.target.closest('button[data-r]'); if(!b) return;

}

function removeChip(kind, val){

/* ------------------------------- search -------------------------------- */
function search(reset){
  if (STATE.group==='hall'){ renderChips(); return loadHall(); }
  if (reset) STATE.page = 0;
  renderChips();
  if (reset) showSkeleton(5);
  var my = ++reqSeq;
  var req = JSON.parse(JSON.stringify(STATE));
  req.wantFacets = true;
  call('apiSearch', req).then(function(r){
    if (my !== reqSeq) return;
    if (!r.ok) return fail(r.error);
    if (reset) LAST.items = r.items; else LAST.items = LAST.items.concat(r.items);
    LAST.total = r.total;
    renderStrip(r.summary);
    renderResults(LAST.items, reset);
    applyFacets(r.facets);
    syncSortSelect();
    var unit = STATE.group==='product'?'รายการ':STATE.group==='shop'?'สาขา':STATE.group==='sub'?'รุ่น':'แถว';
    $('resHead').textContent = r.total ? ('พบ '+nf(r.total)+' '+unit+(STATE.group==='shop'?'ที่มีของ':' มีของใน '+nf(r.summary.shops)+' สาขา'))
                                       : 'ไม่พบสินค้าตามเงื่อนไขนี้';
    $('resInfo').textContent = 'ค้นหาใช้เวลา '+r.took+' ms';
    saveRecent(STATE.q);
    $('moreWrap').classList.toggle('hide', !r.hasMore);
    $('btnMore').textContent = 'โหลดเพิ่ม ' + Math.min(50, r.total - LAST.items.length) + ' รายการ';
  }).catch(function(e){ if(my===reqSeq) fail(e && e.message || e); });
}
/** ให้ dropdown เรียงลำดับตรงกับสถานะจริง (ถ้าไม่มีตัวเลือกตรงกัน ให้ว่างไว้) */
function syncSortSelect(){
  var el=$('sort'); if(!el) return;
  var want=STATE.sort+'|'+STATE.dir, found=false;
  Array.prototype.forEach.call(el.options,function(o){ if(o.value===want) found=true; });
  el.value = found ? want : '';
}
function applyFacets(f){
  if (!f || !BOOT) return;
  MS.forEach(function(d){
    if (!d.facet) return;
    d.counts = f[d.facet] || {};
    // ครั้งแรก (ยังไม่มีตัวกรอง) จำลำดับ "มากไปน้อย" ไว้ ไม่ให้รายการสลับไปมาระหว่างพิมพ์
    if (!msOrdered && !d.fixed){
      var ks = Object.keys(d.counts).sort(function(a,b){
        var dd=(d.counts[b]||0)-(d.counts[a]||0);
        return dd || (a<b?-1:1);
      });
      d.order = {}; ks.forEach(function(v,i){ d.order[v]=i; });
    }
  });
  msOrdered = true;
  msSync();
}

function renderResults(items, reset){
  var box=$('results');
  if (!items.length){ box.innerHTML = emptyState(); return; }
  var html;
  if (STATE.group==='product'){
    PMAX = 1; items.forEach(function(p){ if (p.qty > PMAX) PMAX = p.qty; });

function onCardClick(e){
  var thEl = e.target.closest('th.sortable');
  if (thEl){                                   // กดหัวตาราง
    var key = thEl.getAttribute('data-sort');
    if (STATE.sort === key) STATE.dir = (STATE.dir === 'asc') ? 'desc' : 'asc';
    else { STATE.sort = key; STATE.dir = TEXT_SORT[key] ? 'asc' : 'desc'; }
    syncSortSelect(); search(true);
    return;
  }
  var dclr = e.target.closest('.dclear');
  if (dclr){                                    // ปุ่ม X ล้างช่องค้นหาในรายการที่กางออกมา
    var dinp = dclr.previousElementSibling;
    dinp.value=''; dinp.dispatchEvent(new Event('input', {bubbles:true}));
    dinp.focus();
    return;
  }
  var ds = e.target.closest('[data-ds]');
  if (ds){                                     // ปุ่มเรียงในรายการที่กางออกมา
    var c0 = ds.closest('.card');
    c0.dataset.dsort = ds.getAttribute('data-ds');
    delete c0.dataset.loaded;
    loadDetail(c0);
    return;
  }
  var card = e.target.closest('.card'); if (!card) return;
  if (!e.target.closest('.card-main')) return;  // คลิกในรายการที่กางอยู่ ไม่ต้องหุบการ์ด
  var open = card.classList.toggle('open');
  if (!open || card.dataset.loaded) return;
  loadDetail(card);
}
function loadDetail(card){
  var kind = card.dataset.kind, code = card.dataset.code;
  var box = card.querySelector('.c-detail');
  box.innerHTML = '<div class="dloading">กำลังโหลด…</div>';
  var req = JSON.parse(JSON.stringify(STATE));
  req.group='row'; req.page=0; req.pageSize=200000; req.wantFacets=false;
  var dsort = card.dataset.dsort || (kind==='u' ? 'cover' : 'qty');
  req.sort = dsort; req.dir = (dsort==='cover') ? 'asc' : 'desc';
  if (kind==='p') req.pinProduct = code;
  else if (kind==='s') req.pinShop = code;
  else req.pinSub = +code;
  call('apiSearch', req).then(function(r){
    if (!r.ok){ box.innerHTML='<div class="dloading">โหลดไม่สำเร็จ</div>'; return; }
    card.dataset.loaded = '1';
    if (!r.items.length){ box.innerHTML='<div class="dloading">ไม่มีข้อมูล</div>'; return; }
    var seen = {};
    var rows = (kind!=='u') ? r.items : r.items.filter(function(x){
      if (seen[x.sc]) return false; seen[x.sc]=1; return true;   // 1 บรรทัดต่อสาขา
    });
    var rowsData = rows.map(function(x){
      var main, sub, ftx;
      if (kind==='p'){ main=esc(x.sn); sub=esc(x.sc)+' \u00b7 '+esc(x.ar)+'<span class="dtags">'+tyTag(x.sc)+(hasCover(x.cat)?'<span class="cwv '+cwInfo(x.cw).c+'" style="font-size:11px;padding:0 6px;min-width:0">Cover '+(x.cw==null?'No Sale':cwInfo(x.cw).v)+'</span>':'')+'</span>'; ftx=x.sn+' '+x.sc+' '+x.ar+' '+(SHOPTYPE[x.sc]||''); }
      else if (kind==='s'){ main=esc(x.pn); sub=esc(x.pc)+' \u00b7 '+esc(x.br)+' \u00b7 \u0e3f '+nf(x.pr)+' /\u0e0a\u0e34\u0e49\u0e19'; ftx=x.pn+' '+x.pc+' '+x.br; }
      else { main=esc(x.sn); sub='\u0e04\u0e07\u0e40\u0e2b\u0e25\u0e37\u0e2d '+nf(x.pq==null?x.b:x.pq)+' \u0e0a\u0e34\u0e49\u0e19 \u00b7 \u0e02\u0e32\u0e22/\u0e2a\u0e31\u0e1b\u0e14\u0e32\u0e2b\u0e4c '+
             (x.aws==null?'0':x.aws.toFixed(1))+' \u00b7 '+esc(x.ar); ftx=x.sn+' '+x.ar; }
      var right = (kind==='u')
        ? cwChip(x.cw)
        : '<div class="dright"><div class="dqty mono'+(x.b<=3?' low':'')+'" style="color:var(--'+
            (x.b<=1?'danger':x.b<=3?'warn':'ink')+')">'+nf(x.b)+'</div>'+
          '<div class="dval mono">\u0e23\u0e27\u0e21 \u0e3f '+nf(x.val)+'</div></div>';
      return { f: ftx.toLowerCase(),
               h: '<div class="dmain"><div class="n">'+main+'</div><div class="m">'+sub+'</div></div>'+right };
    });
    var head = '';
    if (kind !== 'u'){
      var bar = ['qty','value','price'].map(function(k){
        return '<button data-ds="'+k+'"'+(dsort===k?' class="on"':'')+'>'+SORT_LABEL[k]+'</button>';
      }).join('');
      head += '<div class="dsort">\u0e40\u0e23\u0e35\u0e22\u0e07\u0e15\u0e32\u0e21 '+bar+'</div>';
    }
    if (rowsData.length > 10){
      var ftype = kind==='s' ? '\u0e2a\u0e34\u0e19\u0e04\u0e49\u0e32' : '\u0e2a\u0e32\u0e02\u0e32';
      head += '<div class="dfind"><input type="text" placeholder="\u0e04\u0e49\u0e19\u0e2b\u0e32'+ftype+'\u0e43\u0e19 '+nf(rowsData.length)+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u2026" data-dfind>'+
        '<button type="button" class="dclear"><svg style="width:13px;height:13px"><use href="#i-x"/></svg></button></div>';
    }
    box.innerHTML = head + '<div class="dlist"></div><div class="dfoot"></div>';
    var list = box.querySelector('.dlist');
    box._st = { all: rowsData, view: rowsData, shown: 0 };
    list.addEventListener('scroll', function(){
      if (list.scrollTop + list.clientHeight >= list.scrollHeight - 120) renderDetail(box, false);
    });
    renderDetail(box, true);
  }).catch(function(){ box.innerHTML='<div class="dloading">โหลดไม่สำเร็จ</div>'; });
}
var DCHUNK = 120;
function renderDetail(box, reset){
  var st = box._st; if (!st) return;
  var list = box.querySelector('.dlist'); if (!list) return;
  if (reset){ st.shown = 0; list.innerHTML = ''; list.scrollTop = 0; }
  var arr = st.view, end = Math.min(arr.length, st.shown + DCHUNK), html = '';
  for (var i = st.shown; i < end; i++){
    html += '<div class="drow"><div class="dnum">'+(i+1)+'</div>'+arr[i].h+'</div>';
  }
  if (html) list.insertAdjacentHTML('beforeend', html);
  st.shown = end;
  updateDetailFoot(box);
}
function updateDetailFoot(box){
  var st = box._st, f = box.querySelector('.dfoot'); if (!st || !f) return;
  if (!st.view.length){ f.innerHTML = '\u0e44\u0e21\u0e48\u0e1e\u0e1a\u0e23\u0e32\u0e22\u0e01\u0e32\u0e23\u0e17\u0e35\u0e48\u0e15\u0e23\u0e07\u0e01\u0e31\u0e19'; return; }
  f.innerHTML = (st.shown < st.view.length)
    ? '\u0e41\u0e2a\u0e14\u0e07 '+nf(st.shown)+' \u0e08\u0e32\u0e01 '+nf(st.view.length)+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23 \u00b7 <span class="dmore">\u0e40\u0e25\u0e37\u0e48\u0e2d\u0e19\u0e25\u0e07\u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e14\u0e39\u0e15\u0e48\u0e2d</span>'
    : '\u0e04\u0e23\u0e1a\u0e17\u0e31\u0e49\u0e07\u0e2b\u0e21\u0e14 '+nf(st.view.length)+' \u0e23\u0e32\u0e22\u0e01\u0e32\u0e23';
}
function onDetailInput(e){
  var inp = e.target.closest('[data-dfind]'); if (!inp) return;
  var box = inp.closest('.c-detail'), st = box._st; if (!st) return;
  var q = inp.value.trim().toLowerCase();

function hallCell(st, sold, wkn){

function hallPrep(){

    ['True','Hall'].forEach(function(k){
      malls.forEach(function(m){ m.shops.forEach(function(s){
        if (s.t===k && pos[s.c]!=null) cols.push({s:s, j:pos[s.c]}); }); });
    });
  } else {                          // จับคู่ตามห้าง
    malls.forEach(function(m){ m.shops.forEach(function(s){ if (pos[s.c]!=null) cols.push({s:s, j:pos[s.c]}); }); });
  }
  cols.forEach(function(c,i){       // ตำแหน่งเส้นคั่น: เริ่มฝั่ง Hall / เริ่มห้างใหม่
    var p=cols[i-1];
    c.sideStart = i>0 && c.s.t==='Hall' && (!p || p.s.t!=='Hall' || (HS.layout!=='side' && p.s.m!==c.s.m));
    c.mallStart = i>0 && HS.layout!=='side' && p.s.m!==c.s.m;
  });
  var toks = HS.q ? HS.q.toLowerCase().split(/\s+/).filter(Boolean) : [];
  var out = [];
  D.rows.forEach(function(r){
    if (!hallRowOk(r)) return;
    if (toks.length){ var t=(r.sm+' '+r.md+' '+r.br).toLowerCase();
      for (var x=0;x<toks.length;x++) if (t.indexOf(toks[x])<0) return; }
    var any=false, sold=0, cells=cols.map(function(c){
      var st=r.st[c.j], sd=r.sold[c.j]; if (st>0||sd>0) any=true; sold+=sd;
      return hallCell(st, sd, wkn);
    });
    if (!any) return;
    var sig=[];
    malls.forEach(function(m){
      var tst=0, taws=0; cols.forEach(function(c,i){ if (c.s.m===m && c.s.t==='True'){ tst+=cells[i].st; taws+=cells[i].aws; } });
      cols.forEach(function(c,i){
        if (c.s.m!==m || c.s.t!=='Hall') return;
        var e=cells[i], tag=m.k+(m.shops.filter(function(z){return z.t==='Hall';}).length>1 ? ' '+c.s.l.replace('DTAC Hall ','') : '');
        if (e.cls==='hc-oos') sig.push({k:'oos', t:'Hall '+tag+' ขาด'+(tst?' · True มี '+tst:'')});
        else if (e.cls==='hc-cw-crit') sig.push({k:'low', t:'Hall '+tag+' ใกล้หมด'+(tst?' · True มี '+tst:'')});
        else if (e.cls==='hc-cw-over') sig.push({k:'over', t:'Hall '+tag+' สต็อกเกิน'});
        else if (e.cls==='hc-ns') sig.push({k:'ns', t:'Hall '+tag+' ไม่มียอดขาย '+e.st+' ชิ้น'+(taws>0?' · True ขาย '+taws.toFixed(1)+'/wk':'')});
      });
    });
    if (HS.view==='act' && !sig.some(function(g){ return g.k==='oos'||g.k==='low'; })) return;
    if (HS.view==='over' && !sig.some(function(g){ return g.k==='over'; })) return;
    if (HS.view==='ns' && !sig.some(function(g){ return g.k==='ns'; })) return;
    out.push({r:r, cells:cells, sold:sold, sig:sig, acts:hallActs(cols, cells)});
  });
  out.sort(function(a,b){
    var ca=HALL_CAT[a.r.cat], cb=HALL_CAT[b.r.cat];
    if (ca!==cb) return (ca==null?9:ca)-(cb==null?9:cb);
    if (a.r.br!==b.r.br) return a.r.br<b.r.br?-1:1;
    if (b.sold!==a.sold) return b.sold-a.sold;
    return a.r.sm<b.r.sm?-1:1;

    if (HS.view==='act' && !sig.some(function(g){ return g.k==='oos'||g.k==='low'; })) return;
    if (HS.view==='over' && !sig.some(function(g){ return g.k==='over'; })) return;

  });
  out.sort(function(a,b){

    return a.r.sm<b.r.sm?-1:1;

function hallShopSum(){

    var e=cells[i], nm=hallMallName(c.s);

      if (tq>0 && tr.indexOf(c.s.m.n+' มี '+nf(tq)+' ชิ้น')<0) tr.push(c.s.m.n+' มี '+nf(tq)+' ชิ้น');

  var o=[];

  if (tr.length)    o.push({k:'tr',  t:'โอนจาก True ได้', tip:'True Shop ห้างเดียวกัน: '+tr.join(', ')});

function renderHallStrip(P, sum){

  P.cols.forEach(function(c){ var o=sum[c.s.c]; if(!o) return; nm[c.s.m.k]=1;
    if (c.s.t==='Hall'){ h+=o.q; ha+=o.aws; hn++; oos+=o.oos; ns+=o.ns; nsq+=o.nsq; } else { t+=o.q; ta+=o.aws; tn++; } });
  var sc=esc(hallScope()), nMall=Object.keys(nm).length;
  $('hallKpi').innerHTML =
    hkpi('k-hall','i-shop', sc+'ใน DTAC Hall', nf(h), 'ชิ้น', 'Cover '+cwWk(h,ha)+' สัปดาห์ · '+hn+' สาขา') +
    hkpi('k-true','i-shop', sc+'ใน True Shop', nf(t), 'ชิ้น', 'Cover '+cwWk(t,ta)+' สัปดาห์ · '+tn+' สาขา') +
    hkpi('k-share','i-gauge','สัดส่วนสต็อกของ Hall', (h+t ? Math.round(h/(h+t)*1000)/10 : 0)+'%', '', 'ของสต็อก'+sc+' '+nMall+' ห้าง') +
    hkpi('k-oos','i-alert','รุ่นที่ Hall ขาด', nf(oos), 'รุ่น', 'มียอดขายแต่คงเหลือ 0') +
    hkpi('k-ns','i-box','ของค้างใน Hall', nf(nsq), 'ชิ้น', nf(ns)+' รุ่นไม่มียอดขาย 4 สัปดาห์');
}
function renderHallStripG7(sum){

  var ss = H.q+T.q ? Math.round(H.q/(H.q+T.q)*1000)/10 : 0, sa = H.aws+T.aws ? Math.round(H.aws/(H.aws+T.aws)*1000)/10 : 0;

    hkpi('k-true','i-shop', sc+'ใน True Shop', nf(T.q), 'ชิ้น', 'Cover '+cwWk(T.q,T.aws)+' สัปดาห์ · '+T.n+' สาขา') +
    hkpi('k-share','i-gauge','Hall ถือสต็อก / ได้ยอดขาย', ss+'%', '', 'สัดส่วนยอดขายของ Hall '+sa+'%') +

    hkpi('k-ns','i-box','ของค้างใน Hall', nf(H.nsq), 'ชิ้น', nf(H.ns)+' รุ่นไม่มียอดขาย 4 สัปดาห์');
}
function hallCard(m, sum){
  var B={True:{q:0,aws:0,oos:0,low:0,over:0,ns:0,ls:[]}, Hall:{q:0,aws:0,oos:0,low:0,over:0,ns:0,ls:[]}};
  m.shops.forEach(function(s){ var o=sum[s.c]; if(!o) return; var b=B[s.t];
    ['q','aws','oos','low','over','ns'].forEach(function(k){ b[k]+=o[k]; }); b.ls.push({l:s.l, c:s.c, q:o.q}); });
  var share = B.Hall.q+B.True.q ? Math.round(B.Hall.q/(B.Hall.q+B.True.q)*1000)/10 : 0;
  function box(k){
    var b=B[k], cwv=b.aws>0 ? Math.round(b.q/b.aws*100)/100 : null, ci=cwInfo(cwv);
    var shops = b.ls.length>1 ? b.ls.map(function(x){ return esc(x.l.replace(/^DTAC /,''))+' '+nf(x.q); }).join(' · ')
                              : (b.ls[0] ? esc(b.ls[0].l)+' <span class="mono">'+b.ls[0].c+'</span>' : '');
    return '<div class="hbx hbx-'+k.toLowerCase()+'"><div class="hbx-t">'+(k==='Hall'?'DTAC Hall':'True Shop')+'</div>'+
      '<div class="hbx-v mono">'+nf(b.q)+' <small>ชิ้น</small></div>'+
      '<div class="hbx-r"><span>ขาย/สัปดาห์ '+(Math.round(b.aws*10)/10).toFixed(1)+'</span>'+
        (b.aws>0 ? '<span class="cwp '+ci.c+'">Cover '+ci.v+'</span>' : (b.q>0?'<span class="cwp cw-none">No Sale</span>':''))+'</div>'+
      '<div class="hbx-s">'+shops+'</div></div>';
  }
  function st(k, lbl, v, cls){
    return '<button type="button" class="hst '+cls+'" data-cm="'+m.k+'" data-cv="'+v+'"><span>'+lbl+'</span>'+
      '<b class="mono">'+nf(B.Hall[k])+' <small>('+nf(B.True[k])+')</small></b></button>';
  }
  return '<article class="hm2"><div class="hm2-h"><b>'+esc(m.n)+'</b><span class="rg">'+esc(m.r)+'</span>'+
    '<span class="sh">Hall ถือ <b>'+share+'%</b></span></div>'+
    '<div class="hm2-bar" title="True Shop '+(Math.round((100-share)*10)/10)+'% · DTAC Hall '+share+'%"><i class="bt" style="width:'+(100-share)+'%"></i><i class="bh" style="width:'+share+'%"></i></div>'+
    '<div class="hm2-box">'+box('True')+box('Hall')+'</div>'+
    '<div class="hm2-sl">สิ่งที่ Hall ต้องจัดการ (จำนวนรุ่น · ในวงเล็บคือฝั่ง True)</div>'+
    '<div class="hm2-st">'+st('oos','ขาด','act','s-oos')+st('low','ใกล้หมด','act','s-low')+st('over','สต็อกเกิน','over','s-over')+st('ns','ไม่มียอดขาย','ns','s-ns')+'</div></article>';
}
function hallViewCounts(){
  var v=HS.view; HS.view='all'; var P=hallPrep(); HS.view=v;
  var n={all:P.rows.length, act:0, over:0, ns:0};
  P.rows.forEach(function(x){ var k={}; x.sig.forEach(function(g){ k[g.k]=1; });
    if (k.oos||k.low) n.act++; if (k.over) n.over++; if (k.ns) n.ns++; });
  return n;
}

function hallTable(P){

  var h='<div class="tablewrap hall-tw"><table class="grid hall layout-'+HS.layout+'"><thead><tr><th rowspan="2" class="hsm">รุ่น</th>';

  h+='<th rowspan="2" class="hsig">'+(P.g7?'แจ้งเตือน (Hall เทียบ True 7)':'สิ่งที่ต้องทำ')+'</th></tr><tr>';

    h+='<th class="hs '+(c.s.t==='Hall'?'hs-hall':'hs-true')+(c.s.agg?' agg':'')+xc(c)+'">'+
       (P.g7 ? esc(c.s.l)+'<small>'+(c.s.miss?'ไม่มีข้อมูล':esc(c.s.c))+'</small>'
             : HS.layout==='side' ? esc(c.s.m.n)+'<small>'+esc(c.s.l)+'</small><small>'+c.s.c+'</small>'
                           : '<span class="hpill">'+esc(c.s.l.replace(/^DTAC /,''))+'</span><small>'+c.s.c+'</small>')+'</th>';
  });
  h+='</tr></thead><tbody>';
  var ncol=P.cols.length+2, lastBr=null, tot=P.cols.map(function(){ return {q:0,aws:0}; });
  P.rows.forEach(function(x){
    var r=x.r;
    if (r.br!==lastBr){
      lastBr=r.br;
      var n=P.rows.filter(function(y){ return y.r.br===r.br && y.r.cat===r.cat; }).length;
      h+='<tr class="hgrp"><td colspan="'+ncol+'"><span class="hgrp-in">'+esc(r.br)+' <span>· '+esc(HALL_CAT_LBL[r.cat]||r.cat)+' · '+n+' รุ่น</span></span></td></tr>';
    }
    h+='<tr><td class="hsm"><div class="pn">'+esc(r.sm)+'</div><div class="pm">'+esc(r.md)+'</div></td>';
    x.cells.forEach(function(e,i){
      tot[i].q+=e.st; tot[i].aws+=e.aws;
      h+='<td class="hc '+e.cls+(P.cols[i].s.t==='Hall'?' is-hall':'')+(P.cols[i].s.agg?' agg':'')+xc(P.cols[i])+'"><b class="mono">'+(e.st?nf(e.st):'–')+'</b>'+(e.lb?'<small>'+e.lb+'</small>':'')+'</td>';
    });
    h+='<td class="hsig">'+(x.acts ? '<div class="acts">'+x.acts.map(function(g){ return '<span class="sg sg-'+g.k+'"'+(g.tip?' title="'+esc(g.tip)+'"':'')+'>'+esc(g.t)+'</span>'; }).join('')+'</div>'
      : x.sig.map(function(g){ return '<span class="sg sg-'+g.k+'">'+esc(g.t)+'</span>'; }).join(''))+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><th class="hsm">TOTAL · '+nf(P.rows.length)+' รุ่น</th>';
  tot.forEach(function(t,i){ h+='<th class="hc'+(P.cols[i].s.agg?' agg':'')+xc(P.cols[i])+'"><b class="mono">'+nf(t.q)+'</b><small>'+(t.aws>0?cwInfo(Math.round(t.q/t.aws*100)/100).v+' wk':'–')+'</small></th>'; });
  var nsig=P.rows.filter(function(x){ return x.sig.length; }).length;
  h+='<th class="hsig">'+nf(nsig)+' รุ่นมีแจ้งเตือน</th></tr></tfoot></table></div>';
  return h;
}
function exportHall(){
  if (!HS.data) return;
  var P=hallPrep();
  function q(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  var head=['CATEGORY','BRAND','MODEL','SUBMODEL'];
  P.cols.forEach(function(c){ var k=c.s.c+' '+c.s.l; head.push(q(k+' STOCK'), q(k+' AWS'), q(k+' COVER_WEEK')); });
  head.push('DTAC_HALL_ALERT');
  var out=[head.join(',')];
  P.rows.forEach(function(x){
    var a=[q(x.r.cat),q(x.r.br),q(x.r.md),q(x.r.sm)];
    x.cells.forEach(function(e){ a.push(e.st, e.aws?Math.round(e.aws*100)/100:'', e.cw==null?'':e.cw); });
    a.push(q(x.sig.map(function(g){return g.t;}).join(' | ')));
    out.push(a.join(','));
  });
  if (!window.__SITE__){ toast('พร้อมส่งออก '+nf(P.rows.length)+' รุ่น — ปุ่มนี้จะดาวน์โหลดไฟล์จริงเมื่อเปิดจากเว็บ'); return; }
  var blob=new Blob(['﻿'+out.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a2=document.createElement('a'); a2.href=URL.createObjectURL(blob);
  a2.download='dtac_hall_stock_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a2); a2.click(); a2.remove();
  toast('ส่งออก '+nf(P.rows.length)+' รุ่นเรียบร้อย');
}
