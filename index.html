        '<div class="seg2" id="hallLayout">'+
          '<button data-hl="mall">จับคู่ตามห้าง</button>'+
          '<button data-hl="side">แยกฝั่ง True | Hall</button>'+
        '</div>'+
        '<button type="button" class="hall-csv" id="hallCsv"><svg><use href="#i-export"/></svg>ส่งออก CSV</button>'+
        '<span class="hall-note">ตัวเลข = คงเหลือ (ชิ้น) · ใต้ตัวเลข = Cover Week · ช่อง Hall ที่มีพื้นสี = ต้องจัดการ</span>'+
      '</div>'+
      '<div id="hallTable"></div>'+
      coverLegend();
    function go(e){
      var b=e.target.closest('[data-hm]'); if (b){ HS.mall=b.getAttribute('data-hm'); return updateHall(); }
      var v=e.target.closest('[data-hv]'); if (v){ HS.view=v.getAttribute('data-hv'); return updateHall(true); }
      var l=e.target.closest('[data-hl]'); if (l){ HS.layout=l.getAttribute('data-hl'); return updateHall(true); }
      var s=e.target.closest('[data-cm]'); if (s){ HS.mall=s.getAttribute('data-cm'); HS.view=s.getAttribute('data-cv'); updateHall();
        var t=$('hallCtl3'); if (t) t.scrollIntoView({behavior:'smooth', block:'start'}); }
    }
    box.addEventListener('click', go);
    $('hallCsv').addEventListener('click', exportHall);
    $('hallPick').addEventListener('change', function(){
      var v=this.value.split('|');
      HS.cat   = v[0]==='c' ? v[1] : 'all';
      HS.brand = v[0]==='b' ? v[1] : 'all';
      updateHall();
    });
    var deb; $('hallQ').addEventListener('input', function(){
      var el=this; clearTimeout(deb); deb=setTimeout(function(){ HS.q=el.value.trim(); updateHall(true); }, 250);
    });
    $('hallQ').value=HS.q;
  }
  $('strip').innerHTML='';
  hallPickOpts();
  updateHall();
}
function updateHall(tableOnly){
  document.querySelectorAll('#hallMall [data-hm]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-hm')===HS.mall); });
  document.querySelectorAll('#hallLayout [data-hl]').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-hl')===HS.layout); });
  var n=hallViewCounts();
  $('hallView').innerHTML=[['all','ทุกรุ่น'],['act','Hall ขาด / ใกล้หมด'],['over','Hall สต็อกเกิน'],['ns','Hall ไม่มียอดขาย']].map(function(v){
    return '<button type="button" data-hv="'+v[0]+'" class="hv hv-'+v[0]+(HS.view===v[0]?' on':'')+'">'+v[1]+' <span class="mono">'+nf(n[v[0]])+'</span></button>'; }).join('');
  var P=hallPrep(), sum=hallShopSum();
  document.body.classList.toggle('hall-g7', !!P.g7);
  if (!tableOnly){
    if (P.g7){ renderHallStripG7(sum); $('hallCards').innerHTML = hallCardG7(sum); }
    else { renderHallStrip(P, sum); $('hallCards').innerHTML = P.malls.map(function(m){ return hallCard(m, sum); }).join(''); }
    $('hallCards').classList.toggle('one', !P.g7 && P.malls.length===1);
  }
  $('hallTable').innerHTML = hallTable(P);
  $('resInfo').innerHTML = 'พบ <b>'+nf(P.rows.length)+'</b> รุ่น · '+(P.g7 ? 'Hall 4 vs True 7 สาขา' : P.cols.length+' สาขา');
}
function hallTable(P){
  if (!P.rows.length) return emptyState();
  var h='<div class="tablewrap hall-tw"><table class="grid hall layout-'+HS.layout+'"><thead><tr><th rowspan="2" class="hsm">รุ่น</th>';
  function xc(c){ return (c.sideStart?' side-start':'')+(c.mallStart?' mall-start':''); }
  if (P.g7){
    h+='<th class="hm hm-hall">DTAC HALL <span>4 สาขา</span></th>'+
       '<th colspan="'+(P.cols.length-1)+'" class="hm hm-true side-start">TRUE SHOP <span>7 สาขา</span></th>';
  } else if (HS.layout==='side'){
    ['True','Hall'].forEach(function(k){
      var cs=P.cols.filter(function(c){ return c.s.t===k; }); if (!cs.length) return;
      h+='<th colspan="'+cs.length+'" class="hm hm-'+k.toLowerCase()+xc(cs[0])+'">'+(k==='Hall'?'DTAC HALL':'TRUE SHOP')+
         ' <span>'+cs.length+' สาขา</span></th>';
    });
  } else {
    P.malls.forEach(function(m){
      var cs=P.cols.filter(function(c){ return c.s.m===m; });
      if (cs.length) h+='<th colspan="'+cs.length+'" class="hm'+xc(cs[0])+'">'+esc(m.n)+' <span>'+esc(m.r)+'</span></th>';
    });
  }
  h+='<th rowspan="2" class="hsig">'+(P.g7?'แจ้งเตือน (Hall เทียบ True 7)':'สิ่งที่ต้องทำ')+'</th></tr><tr>';
  P.cols.forEach(function(c){
    h+='<th class="hs '+(c.s.t==='Hall'?'hs-hall':'hs-true')+(c.s.agg?' agg':'')+xc(c)+'">'+
       (P.g7 ? esc(c.s.l)+'<small>'+(c.s.miss?'ไม่มีข้อมูล':esc(c.s.c))+'</small>'
             : HS.layout==='side' ? esc(c.s.m.n)+'<small>'+esc(c.s.l)+'</small><small>'+c.s.c+'</small>'
                           : '<span class="hpill">'+esc(c.s.l.replace(/^DTAC /,''))+'</span><small>'+c.s.c+'</small>')+'</th>';
  });
  h+='</tr></thead><tbody>';
  var ncol=P.cols.length+2, lastBr=null, tot=P.cols.map(function(){ return {q:0,aws:0}; });
  P.rows.forEach(function(x){
    var r=x.r;
    if (r.br!==lastBr){
      lastBr=r.br;
      var n=P.rows.filter(function(y){ return y.r.br===r.br && y.r.cat===r.cat; }).length;
      h+='<tr class="hgrp"><td colspan="'+ncol+'"><span class="hgrp-in">'+esc(r.br)+' <span>· '+esc(HALL_CAT_LBL[r.cat]||r.cat)+' · '+n+' รุ่น</span></span></td></tr>';
    }
    h+='<tr><td class="hsm"><div class="pn">'+esc(r.sm)+'</div><div class="pm">'+esc(r.md)+'</div></td>';
    x.cells.forEach(function(e,i){
      tot[i].q+=e.st; tot[i].aws+=e.aws;
      h+='<td class="hc '+e.cls+(P.cols[i].s.t==='Hall'?' is-hall':'')+(P.cols[i].s.agg?' agg':'')+xc(P.cols[i])+'"><b class="mono">'+(e.st?nf(e.st):'–')+'</b>'+(e.lb?'<small>'+e.lb+'</small>':'')+'</td>';
    });
    h+='<td class="hsig">'+(x.acts ? '<div class="acts">'+x.acts.map(function(g){ return '<span class="sg sg-'+g.k+'"'+(g.tip?' title="'+esc(g.tip)+'"':'')+'>'+esc(g.t)+'</span>'; }).join('')+'</div>'
      : x.sig.map(function(g){ return '<span class="sg sg-'+g.k+'">'+esc(g.t)+'</span>'; }).join(''))+'</td></tr>';
  });
  h+='</tbody><tfoot><tr><th class="hsm">TOTAL · '+nf(P.rows.length)+' รุ่น</th>';
  tot.forEach(function(t,i){ h+='<th class="hc'+(P.cols[i].s.agg?' agg':'')+xc(P.cols[i])+'"><b class="mono">'+nf(t.q)+'</b><small>'+(t.aws>0?cwInfo(Math.round(t.q/t.aws*100)/100).v+' wk':'–')+'</small></th>'; });
  var nsig=P.rows.filter(function(x){ return x.sig.length; }).length;
  h+='<th class="hsig">'+nf(nsig)+' รุ่นมีแจ้งเตือน</th></tr></tfoot></table></div>';
  return h;
}
function exportHall(){
  if (!HS.data) return;
  var P=hallPrep();
  function q(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  var head=['CATEGORY','BRAND','MODEL','SUBMODEL'];
  P.cols.forEach(function(c){ var k=c.s.c+' '+c.s.l; head.push(q(k+' STOCK'), q(k+' AWS'), q(k+' COVER_WEEK')); });
  head.push('DTAC_HALL_ALERT');
  var out=[head.join(',')];
  P.rows.forEach(function(x){
    var a=[q(x.r.cat),q(x.r.br),q(x.r.md),q(x.r.sm)];
    x.cells.forEach(function(e){ a.push(e.st, e.aws?Math.round(e.aws*100)/100:'', e.cw==null?'':e.cw); });
    a.push(q(x.sig.map(function(g){return g.t;}).join(' | ')));
    out.push(a.join(','));
  });
  if (!window.__SITE__){ toast('พร้อมส่งออก '+nf(P.rows.length)+' รุ่น — ปุ่มนี้จะดาวน์โหลดไฟล์จริงเมื่อเปิดจากเว็บ'); return; }
  var blob=new Blob(['﻿'+out.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a2=document.createElement('a'); a2.href=URL.createObjectURL(blob);
  a2.download='dtac_hall_stock_'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a2); a2.click(); a2.remove();
  toast('ส่งออก '+nf(P.rows.length)+' รุ่นเรียบร้อย');
}

if (!window.__LOCKED__) document.addEventListener('DOMContentLoaded', init);
</script>

<script>
/* =========================================================================
 * PREVIEW ENGINE — จำลอง server ของ Apps Script ให้ทำงานในเบราว์เซอร์
 * ตรรกะการค้นหา/นับ facet เหมือนกับ runQuery_() ใน Code.gs ทุกประการ
 * (ในระบบจริง โค้ดส่วนนี้ทำงานบนเซิร์ฟเวอร์ ไม่ถูกส่งลงเบราว์เซอร์)
 * ======================================================================= */
window.__BOOT_ENGINE__ = (function () {
  return function () {
  var IDX = window.__DATA__;
  IDX.ptext = IDX.products.map(function (p) {
    return (p[0]+' '+p[1]+' '+p[3]+' '+p[4]+' '+p[5]+' '+p[6]+' '+p[2]).toLowerCase();
  });
  IDX.stext = IDX.shops.map(function (s) {
    return (s[0]+' '+s[1]+' '+s[2]+' '+s[3]).toLowerCase();
  });
  var WK = (IDX.coverDays || 28) / 7;
  var SM = {}, SA = IDX.sales || [];
  for (var q0 = 0; q0 < SA.length; q0 += 3) SM[SA[q0]+'|'+SA[q0+1]] = SA[q0+2];
  var HAS = SA.length > 0;
  IDX.subMeta = [];
  IDX.products.forEach(function(p){
    if (p[9] != null && !IDX.subMeta[p[9]]) IDX.subMeta[p[9]] = {n:IDX.subs[p[9]],md:p[4],br:p[3],cat:p[2]};
  });
  // รุ่นที่ขายได้แต่ไม่มีสต็อกเหลือทุกสาขา (update.py ส่งมาใน subx = {ui:[cat,brand,model]})
  var SX = IDX.subx || {};
  for (var ux in SX) if (!IDX.subMeta[+ux]) IDX.subMeta[+ux] = {n:IDX.subs[+ux],md:SX[ux][2],br:SX[ux][1],cat:SX[ux][0]};
  var ccObj = {};
  for (var q1 = 0; q1 < SA.length; q1 += 3){ var mt=IDX.subMeta[SA[q1+1]]; if(mt) ccObj[mt.cat]=1; }
  IDX.coverCats = Object.keys(ccObj).sort();
  function cwCalc(qty, sold){ return sold ? Math.round(qty/(sold/WK)*100)/100 : null; }

  var F_KW=1,F_CAT=2,F_BRD=4,F_MDL=8,F_STS=16,F_ARE=32,F_SHP=64,F_QTY=128,F_STY=256;
  function toSet(a){ if(!a||!a.length) return null; var s={}; a.forEach(function(v){s[v]=1;}); return s; }
  function toks(q){ return q ? String(q).toLowerCase().replace(/,/g,' ').split(/\s+/).filter(Boolean) : []; }
  function all(t,ks){ for(var i=0;i<ks.length;i++) if(t.indexOf(ks[i])<0) return false; return true; }
  function ck(o){ var n=0; for(var k in o) n++; return n; }
  function ksort(o){ var a=[]; for(var k in o) a.push(k); a.sort(); return a; }

  function runQuery(req){
    var P=IDX.products, S=IDX.shops, ST=IDX.stock;
    var kw=toks(req.q), skw=toks(req.shopQ);
    var sCat=toSet(req.cat), sBrd=toSet(req.brand), sMdl=toSet(req.model),

        if(!ap){ ap=aggPair[pkey]={q:0,sold:SM[pkey]||0}; au.sold+=ap.sold; au.shops++; }

          case 'brand': x=a.br||'';     y=b.br||'';     break;
          case 'shop':  x=a.sn||'';     y=b.sn||'';     break;
          case 'price': x=a.pr||0;      y=b.pr||0;      break;
          case 'value': x=a.val||0;     y=b.val||0;     break;
          case 'aws':   x=a.aws==null?-1:a.aws; y=b.aws==null?-1:b.aws; break;

            if(a.cw==null) return 1; if(b.cw==null) return -1;
            x=a.cw; y=b.cw; break;
          default:      x=a.qty||0;     y=b.qty||0;

          case 'value': v=(pp3[8]||0)*bb2; break;
          case 'aws':   v=ap3?ap3.sold/WK:-1; break;

    /* DTAC Hall monitor: สต็อก + ยอดขาย 28 วัน รายรุ่นย่อย (เฉพาะหมวดที่มี Cover Week) ของสาขาที่ส่งมา */
    apiHall: function(req){

      var cc={}; (IDX.coverCats||[]).forEach(function(c){cc[c]=1;});
      function z(){ var a=[]; for(var i=0;i<n;i++) a.push(0); return a; }
      var rows={}, allQ=z(), allV=z();

        var m=IDX.subMeta[ui]; if(!m||!cc[m.cat]) return null;
        return rows[ui]||(rows[ui]={ui:ui,sm:m.n,br:m.br,md:m.md,cat:m.cat,st:z(),sold:z(),val:z()});

    window.doExport = function(){

      : 'โหมดพรีวิว · ข้อมูล ณ ' + IDX.built + ' · ในระบบ Apps Script การค้นหาทั้งหมดประมวลผลบนเซิร์ฟเวอร์ และไม่ส่ง Raw Data ลงเบราว์เซอร์';

  // (ถ้าเรียกซ้ำ ปุ่มทุกตัวจะมี listener ซ้อนกันสองชั้น กดแล้วเหมือนไม่ทำงาน)

      say(silent ? '' : (String(err && err.message).indexOf('gzip') >= 0
        ? 'เบราว์เซอร์นี้เก่าเกินไป กรุณาอัปเดตหรือใช้ Chrome/Safari รุ่นใหม่'
        : 'รหัสผ่านไม่ถูกต้อง'));
      var pwEl = document.getElementById('lkPw');
      if (pwEl && !silent) { pwEl.value = ''; pwEl.focus(); }
    });
  }

  function decrypt(pw) {
    var raw = Uint8Array.from(atob(window.__ENC__), function (c) { return c.charCodeAt(0); });
    var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    return crypto.subtle
      .importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (km) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: ITER, hash: 'SHA-256' },
          km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      })
      .then(function (key) { return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct); })
      .then(function (buf) {
        if (typeof DecompressionStream === 'undefined') throw new Error('no gzip support');
        var st = new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'));
        return new Response(st).text();
      });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
  else show();
})();

</script>
